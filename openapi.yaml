openapi: 3.0.3
info:
  title: 山野商城 API
  version: '1.1'
  description: |
    B2C 商城接口契约（唯一来源）。前端类型由本文件 codegen 生成，禁止手写重复 DTO。
    约定：金额一律整数分；时间一律 ISO 8601；错误返回 { code, message, data, requestId }。

servers:
  - url: http://127.0.0.1:3000/api

tags:
  - name: catalog
  - name: cart
  - name: orders
  - name: payments
  - name: admin-orders
  - name: admin-integration
  - name: admin-miniapp
  - name: telemetry

paths:
  /health:
    get:
      tags: [catalog]
      summary: 健康检查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [ok, degraded] }
                      db: { type: boolean }

  /shop:
    get:
      tags: [catalog]
      summary: 店铺配置（包邮门槛、运费、售后期）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ShopConfig'

  /categories:
    get:
      tags: [catalog]
      summary: 分类树
      responses:
        '200': { description: OK }

  /tags:
    get:
      tags: [catalog]
      summary: 标签列表（仅包含在售商品）
      responses:
        '200': { description: OK }

  /search/hot:
    get:
      tags: [search]
      summary: 搜索热词（日志自动聚合，近 30 天）
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string }

  /products:
    get:
      tags: [catalog]
      summary: 商品列表
      parameters:
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: priceMinCents, in: query, schema: { type: integer, minimum: 0 } }
        - { name: priceMaxCents, in: query, schema: { type: integer, minimum: 0 } }
        - { name: tagId, in: query, schema: { type: string } }
        - { name: storeId, in: query, schema: { type: string } }
        - { name: ids, in: query, schema: { type: string }, description: "按商品 id 精确取数（逗号分隔，最多 50 个），顺序与传入一致" }
        - { name: sort, in: query, schema: { type: string, enum: [default, sales, price_asc, price_desc, new] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }

  /products/{id}:
    get:
      tags: [catalog]
      summary: 商品详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /cart:
    get:
      tags: [cart]
      summary: 购物车（含失效区与勾选汇总）
      security: [{ userToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [valid, invalid, summary]
                    properties:
                      valid:
                        type: array
                        items: { $ref: '#/components/schemas/CartItem' }
                      invalid:
                        type: array
                        items: { $ref: '#/components/schemas/CartItem' }
                      summary:
                        type: object
                        properties:
                          checkedCount: { type: integer }
                          checkedAmountCents: { type: integer }

  /cart/items:
    post:
      tags: [cart]
      summary: 加入购物车
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [skuId, quantity]
              properties:
                skuId: { type: string }
                quantity: { type: integer, minimum: 1 }
      responses:
        '200': { description: OK }
        '404': { description: 商品不存在或已售罄 }
    delete:
      tags: [cart]
      summary: 删除指定条目
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200': { description: OK }

  /cart/items/{id}:
    patch:
      tags: [cart]
      summary: 修改数量或勾选
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                quantity: { type: integer, minimum: 1 }
                checked: { type: boolean }
      responses:
        '200': { description: OK }

  /cart/invalid:
    delete:
      tags: [cart]
      summary: 清空失效商品
      security: [{ userToken: [] }]
      responses:
        '200': { description: OK }

  /orders/preview:
    post:
      tags: [orders]
      summary: 结算预览：金额明细、可用券、运费
      security: [{ userToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [items, amount, freight]
                    properties:
                      items: { type: array, items: { $ref: '#/components/schemas/PreviewItem' } }
                      amount: { $ref: '#/components/schemas/AmountBreakdown' }
                      member:
                        type: object
                        properties:
                          levelName: { type: string }
                          rate: { type: number }
                      availableCoupons:
                        type: array
                        items: { $ref: '#/components/schemas/CouponOption' }
                      freight:
                        type: object
                        properties:
                          freeThresholdCents: { type: integer }
                          flatCents: { type: integer }
                          exceptionRegion: { type: boolean }
                      fulfillmentType: { type: string, enum: [EXPRESS, DELIVERY, PICKUP] }
                      delivery:
                        type: object
                        nullable: true
                        properties:
                          slot: { type: string }
                          region: { type: string }
                          feeCents: { type: integer }
                          store:
                            type: object
                            properties:
                              id: { type: string }
                              name: { type: string }
                              phone: { type: string, nullable: true }
                              region: { type: string }
                              address: { type: string }
                              deliverySlots: { type: array, items: { type: string } }
                              deliveryCutoff: { type: string, nullable: true }
                              maxOrdersPerSlot: { type: integer }

  /orders:
    post:
      tags: [orders]
      summary: 创建订单
      security: [{ userToken: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 客户端生成的 UUID；同一用户重复提交返回同一订单
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                addressId: { type: string, description: 快递/配送必填；自提不需要 }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/OrderLine' }
                couponClaimId: { type: string, nullable: true }
                remark: { type: string, maxLength: 200 }
                fulfillmentType: { type: string, enum: [EXPRESS, DELIVERY, PICKUP] }
                storeId: { type: string, nullable: true }
                pickupSlot: { type: string, description: 自提时段 HH:mm-HH:mm }
                deliverySlot: { type: string, description: 同城配送时段 HH:mm-HH:mm }
                contactPhone: { type: string, description: 自提联系电话 }
      responses:
        '201':
          description: 订单创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [orders]
      summary: 我的订单列表
      security: [{ userToken: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING_PAYMENT, PAID, SHIPPED, COMPLETED, REFUNDING, REFUNDED, CLOSED] } }
      responses:
        '200': { description: OK }

  /orders/{id}:
    get:
      tags: [orders]
      summary: 订单详情（含金额快照）
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    post:
      tags: [orders]
      summary: 取消未支付订单并释放预占库存
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/pay:
    post:
      tags: [payments]
      summary: 发起支付，返回渠道参数（mock 或微信 JSAPI）
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 支付参数
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PaymentParams' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payments/mock/confirm:
    post:
      tags: [payments]
      summary: 模拟支付确认（与真实回调同一处理逻辑）
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outTradeNo]
              properties:
                outTradeNo: { type: string }
      responses:
        '200': { description: OK }

  /payments/callback:
    post:
      tags: [payments]
      summary: 支付结果回调（渠道 → 服务端，重复通知必须幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCallback' }
      responses:
        '200': { description: 已处理（重复通知同样返回 200） }
        '409': { description: 回调金额与支付单不一致 }

  /admin/orders:
    get:
      tags: [admin-orders]
      summary: 后台订单列表（含各状态数量，分页）
      security: [{ adminToken: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: storeId, in: query, schema: { type: string } }
        - { name: storeIds, in: query, schema: { type: string, description: 多个门店 ID，逗号分隔 } }
        - name: fulfillmentType
          in: query
          schema: { type: string, enum: [EXPRESS, DELIVERY, PICKUP] }
        - { name: startDate, in: query, schema: { type: string, example: 2026-11-01 } }
        - { name: endDate, in: query, schema: { type: string, example: 2026-11-30 } }
        - { name: minCents, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxCents, in: query, schema: { type: integer, minimum: 0 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tabs:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { type: string }
                            count: { type: integer }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminOrderListItem' }
        '403': { description: 角色无权限 }

  /admin/orders/{id}:
    get:
      tags: [admin-orders]
      summary: 后台订单详情
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /admin/orders/{id}/ship:
    post:
      tags: [admin-orders]
      summary: 发货（仅 SUPER / WMS）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expressCode, expressName, trackingNo]
              properties:
                expressCode: { type: string }
                expressName: { type: string }
                trackingNo: { type: string }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  /after-sales:
    post:
      tags: [after-sales]
      summary: 提交售后申请（退款额默认按行实付，上限不超过行实付）
      security: [{ userToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [orderItemId, type, reason]
              properties:
                orderItemId: { type: string }
                type: { type: string, enum: [REFUND_ONLY, RETURN_REFUND] }
                reason: { type: string }
                description: { type: string }
                refundCents: { type: integer, minimum: 1 }
                evidence: { type: array, items: { type: string } }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AfterSale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 重复申请、超出售后期或订单状态不支持
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [after-sales]
      summary: 我的售后列表
      security: [{ userToken: [] }]
      responses:
        '200': { description: OK }

  /after-sales/{id}:
    get:
      tags: [after-sales]
      summary: 售后详情
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AfterSale' }

  /after-sales/{id}/ship-back:
    post:
      tags: [after-sales]
      summary: 买家填写寄回单号
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trackingNo]
              properties:
                trackingNo: { type: string }
      responses:
        '200': { description: OK }

  /after-sales/{id}/cancel:
    post:
      tags: [after-sales]
      summary: 买家撤销售后（仅待审核阶段）
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /admin/after-sales:
    get:
      tags: [admin-after-sales]
      summary: 售后列表（含各状态数量，分页）
      security: [{ adminToken: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: OK }
        '403': { description: 角色无权限 }

  /admin/after-sales/{id}/moderate:
    post:
      tags: [admin-after-sales]
      summary: 审核售后（同意仅退款 / 同意退货 / 拒绝）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action: { type: string, enum: [approve_only_refund, approve_return, reject] }
                rejectReason: { type: string, description: action=reject 时必填 }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: 角色无权限 }

  /admin/after-sales/{id}/receive:
    post:
      tags: [admin-after-sales]
      summary: 确认收到退货并发起退款
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  /orders/{id}/shipment:
    get:
      tags: [shipment]
      summary: 物流详情（节点时间线）
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShipmentTrace' }

  /admin/orders/close-expired:
    post:
      tags: [admin-orders]
      summary: 手动触发超时关单（定时任务每分钟自动执行）
      security: [{ adminToken: [] }]
      responses:
        '201': { description: 返回本次关闭数量 }
        '403': { description: 仅超管 }

  /orders/{id}/confirm:
    post:
      tags: [orders]
      summary: 确认收货（待收货 → 已完成，之后可评价）
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  /coupons:
    get:
      tags: [coupons]
      summary: 领券中心：可领取的优惠券（含剩余量与我的领取数）
      security: [{ userToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Coupon' }

  /coupons/mine:
    get:
      tags: [coupons]
      summary: 我的优惠券
      security: [{ userToken: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [UNUSED, USED, EXPIRED] }
      responses:
        '200': { description: OK }

  /coupons/{id}/claim:
    post:
      tags: [coupons]
      summary: 领取优惠券（每人限领、总量控制，并发安全）
      security: [{ userToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 领取成功 }
        '409':
          description: 已达每人限领张数 / 已领完 / 未开始或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/coupons:
    get:
      tags: [admin-coupons]
      summary: 优惠券列表（含已领取数，分页）
      security: [{ adminToken: [] }]
      parameters:
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: keyword, in: query, schema: { type: string, description: 优惠券名称模糊匹配 } }
        - { name: type, in: query, schema: { type: string, enum: [THRESHOLD, NO_THRESHOLD] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      items:
                        type: array
                        items: { type: object, additionalProperties: true }
        '403': { description: 角色无权限 }
    post:
      tags: [admin-coupons]
      summary: 新建优惠券（满减 / 无门槛）
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, faceValueCents, total, startAt, endAt]
              properties:
                name: { type: string }
                thresholdCents: { type: integer, minimum: 0, description: 0 表示无门槛券 }
                faceValueCents: { type: integer, minimum: 1 }
                total: { type: integer, minimum: 1 }
                perLimit: { type: integer, minimum: 1 }
                channel: { type: string }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
      responses:
        '201': { description: 创建成功 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/coupons/{id}/toggle:
    post:
      tags: [admin-coupons]
      summary: 启用 / 停用优惠券
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /admin/coupons/{id}/grant:
    post:
      tags: [admin-coupons]
      summary: 后台发放：指定客户或全部客户（逐条跳过超限对象）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

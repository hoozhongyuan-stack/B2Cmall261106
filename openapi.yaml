                        properties:
                          orderPaid: { type: string }
                          orderShipped: { type: string }
                          refundResult: { type: string }
                          pickupReady: { type: string }
                          pickupExpiring: { type: string }
                          deliveryAccepted: { type: string }
                          deliveryDone: { type: string }

  /admin/notifications/logs:
    get:
      tags: [admin-notifications]
      summary: 订阅消息发送日志（按状态/场景筛选）
      security: [{ adminToken: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, SENT, SKIPPED, FAILED] }
        - name: scene
          in: query
          schema: { type: string, enum: [ORDER_PAID, ORDER_SHIPPED, REFUND_RESULT, PICKUP_READY, PICKUP_EXPIRING, DELIVERY_ACCEPTED, DELIVERY_DONE] }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      items:
                        type: array

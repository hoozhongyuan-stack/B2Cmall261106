    post:
      tags: [admin-accounts]
      summary: 新建子账号（仅超管）
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account, displayName, role, password]
              properties:
                account: { type: string }
                displayName: { type: string }
                role: { type: string, enum: [SUPER, OPS, CS, WMS, STORE] }
                password: { type: string, minLength: 8 }
                storeIds:
                  type: array
                  maxItems: 20
                  items: { type: string }
      responses:
        '201': { description: 创建成功 }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/accounts/{id}:
    patch:
      tags: [admin-accounts]
      summary: 修改子账号显示名或角色（不能降级最后一个超管）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string }
                role: { type: string, enum: [SUPER, OPS, CS, WMS, STORE] }
                storeIds:
                  type: array
                  maxItems: 20
                  items: { type: string }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/accounts/{id}/status:
    post:

        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Asset' }

  /admin/assets/folders:
    get:
      tags: [admin-assets]
      summary: 一级文件夹列表（含素材数量）
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      uncategorized: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AssetFolder' }
    post:
      tags: [admin-assets]
      summary: 新建文件夹
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, maxLength: 30 }
                sort: { type: integer, minimum: 0 }
      responses:
        '201': { description: 创建成功 }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/assets/folders/{id}:
    patch:
      tags: [admin-assets]
      summary: 重命名或调整文件夹排序
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 30 }
                sort: { type: integer, minimum: 0 }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-assets]
      summary: 删除空文件夹

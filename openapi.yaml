                type: object
                properties:
                  data: { $ref: '#/components/schemas/MicroPageDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [admin-micro-page]
      summary: 删除微页面（被引用时拒绝）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/micro-pages/{id}/publish:
    post:
      tags: [admin-micro-page]
      summary: 全量校验后发布当前草稿
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MicroPageDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/micro-pages/{id}/rollback:
    post:
      tags: [admin-micro-page]
      summary: 回滚到上一版发布快照
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/micro-pages/{id}/duplicate:
    post:
      tags: [admin-micro-page]
      summary: 复制为新草稿
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK

  /admin/micro-pages/{id}/home:
    post:
      tags: [admin-micro-page]
      summary: 设为小程序首页（需已上线）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/link-options:
    get:
      tags: [admin-micro-page]
      summary: 统一链接选择器数据源
      security: [{ adminToken: [] }]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [micro, product, category, search, seckill, coupon, store, cart, orders, mine, points, page, none]
        - { name: keyword, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/LinkOption' }

  /admin/tabbar:
    get:
      tags: [admin-micro-page]
      summary: 读取底部导航配置
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShopTabbar' }
    put:
      tags: [admin-micro-page]
      summary: 保存底部导航（2~5 个入口，必须有首页）
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopTabbar' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShopTabbar' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /popup-ad/active:
    get:
      tags: [popup-ad]
      summary: 首页弹窗广告列表（启用且时间命中，按优先级）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      serverDate: { type: string, description: YYYY-MM-DD（Asia/Shanghai） }
                      ads:
                        type: array
                        items: { $ref: '#/components/schemas/PopupAd' }

  /admin/popup-ads:
    get:
      tags: [admin-popup-ad]
      summary: 弹窗广告列表
      security: [{ adminToken: [] }]
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PopupAd' }
    post:
      tags: [admin-popup-ad]
      summary: 新建弹窗广告
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PopupAdInput' }
      responses:
        '201': { description: 创建成功 }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/popup-ads/{id}:
    get:
      tags: [admin-popup-ad]
      summary: 弹窗广告详情
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PopupAd' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin-popup-ad]
      summary: 保存弹窗广告
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PopupAdInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PopupAd' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [admin-popup-ad]
      summary: 删除弹窗广告（软删除）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

  /admin/popup-ads/{id}/enabled:
    patch:
      tags: [admin-popup-ad]
      summary: 启用 / 停用弹窗广告
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PopupAd' }
        '400': { $ref: '#/components/responses/BadRequest' }

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 小程序用户令牌（scope=miniapp）
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 后台账号令牌（角色 SUPER/OPS/CS/WMS）

  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突或库存不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: 触发限流（code=RATE_LIMITED）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    SearchKeywordStat:
      type: object
      required: [keyword, count]
      properties:
        keyword: { type: string }
        count: { type: integer }

    ShopConfig:
      type: object
      properties:
        shopName: { type: string }
        intro: { type: string }
        logoKey: { type: string, nullable: true }
        servicePhone: { type: string, nullable: true }
        serviceEmail: { type: string, nullable: true }
        serviceWechat: { type: string, nullable: true }
        serviceHours: { type: string, nullable: true }
        companyAddress: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        creditCode: { type: string, nullable: true }
        icpNumber: { type: string, nullable: true }
        icpUrl: { type: string, nullable: true }
        policeNumber: { type: string, nullable: true }
        policeUrl: { type: string, nullable: true }
        officialSiteUrl: { type: string, nullable: true }
        freeThresholdCents: { type: integer }
        flatFreightCents: { type: integer }
        afterSaleDays: { type: integer }

    CartItem:
      type: object
      required: [id, skuId, quantity, checked, title, priceCents, subtotalCents]
      properties:
        id: { type: string }
        skuId: { type: string }
        quantity: { type: integer }
        checked: { type: boolean }
        title: { type: string }
        spec: { type: object, additionalProperties: { type: string } }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        available: { type: integer }
        subtotalCents: { type: integer }
        invalidReason: { type: string, nullable: true }

    PreviewRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        couponClaimId: { type: string, nullable: true }
        region: { type: string }
        fulfillmentType: { type: string, enum: [EXPRESS, DELIVERY, PICKUP] }
        storeId: { type: string, nullable: true }
        pickupSlot:
          type: string
          description: 自提时段，格式 HH:mm-HH:mm；自提订单省略表示不指定时段
          example: 10:00-12:00
        deliverySlot:
          type: string
          description: 同城配送时段，格式 HH:mm-HH:mm，必须在门店配置时段内
          example: 10:00-12:00

    OrderLine:
      type: object
      additionalProperties: false
      required: [skuId, quantity]
      properties:
        skuId: { type: string }
        quantity: { type: integer, minimum: 1 }

    PreviewItem:
      type: object
      properties:
        skuId: { type: string }
        title: { type: string }
        specText: { type: string }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        quantity: { type: integer }
        subtotalCents: { type: integer }

    CouponOption:
      type: object
      properties:
        claimId: { type: string }
        name: { type: string }
        faceValueCents: { type: integer }
        thresholdCents: { type: integer }
        usable: { type: boolean }
        expiresAt: { type: string, format: date-time }

    AmountBreakdown:
      type: object
      description: 金额快照，全部为整数分；payable = goods - memberDiscount - coupon + freight
      required: [goodsCents, memberDiscountCents, couponCents, freightCents, payableCents]
      properties:
        goodsCents: { type: integer }
        memberDiscountCents: { type: integer }
        couponCents: { type: integer }
        freightCents: { type: integer }
        payableCents: { type: integer }
        refundedCents: { type: integer }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        skuId: { type: string }
        title: { type: string }
        specText: { type: string }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        quantity: { type: integer }
        subtotalCents: { type: integer }

    AdminOrderListItem:
      type: object
      properties:
        id: { type: string }
        orderNo: { type: string }
        status: { type: string }
        payableCents: { type: integer }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        customer:
          type: object
          properties:
            nickname: { type: string, nullable: true }
            phone: { type: string, nullable: true }
        itemCount: { type: integer }
        firstItemTitle: { type: string }
        address: { type: object, additionalProperties: true }
        fulfillmentType: { type: string, enum: [EXPRESS, DELIVERY, PICKUP] }
        storeId: { type: string, nullable: true }
        storeName: { type: string, nullable: true }

    Order:
      type: object
      required: [id, orderNo, status, amount, items]
      properties:
        id: { type: string }
        orderNo: { type: string, example: SY20261106093812 }
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, SHIPPED, COMPLETED, REFUNDING, REFUNDED, CLOSED]
        fulfillmentType: { type: string, enum: [EXPRESS, DELIVERY, PICKUP] }
        storeId: { type: string, nullable: true }
        storeName: { type: string, nullable: true }
        store:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string, nullable: true }
            region: { type: string }
            address: { type: string }
            businessHours: { type: object, additionalProperties: true }
        pickupCode: { type: string, nullable: true, description: 8 位数字核销码，支付成功后生成 }
        pickupAt: { type: string, format: date-time, nullable: true }
        pickupCodeExpiresAt: { type: string, format: date-time, nullable: true }
        deliverySlot: { type: string, nullable: true, description: 同城配送时段 }
        pickupVerifiedAt: { type: string, format: date-time, nullable: true }
        pickupVerification:
          type: object
          nullable: true
          properties:
            method: { type: string, enum: [CODE, QR, AUTO] }
            verifiedBy: { type: string, nullable: true }
            verifiedAt: { type: string, format: date-time }
            note: { type: string, nullable: true }
        payDeadlineAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        shippedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        remark: { type: string, nullable: true }
        address:
          type: object
          properties:
            receiver: { type: string }
            phone: { type: string }
            region: { type: string }
            detail: { type: string }
        amount: { $ref: '#/components/schemas/AmountBreakdown' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        shipment:
          type: object
          nullable: true
          properties:
            expressName: { type: string }
            expressCode: { type: string }
            trackingNo: { type: string }
            shippedAt: { type: string, format: date-time }
        delivery:
          type: object
          nullable: true
          properties:
            status: { type: string, enum: [PENDING, ACCEPTED, DELIVERED, CANCELLED] }
            courierName: { type: string, nullable: true }
            courierPhone: { type: string, nullable: true }
            acceptedAt: { type: string, format: date-time, nullable: true }
            deliveredAt: { type: string, format: date-time, nullable: true }
            remark: { type: string, nullable: true }

    Delivery:
      type: object
      properties:
        id: { type: string }
        orderId: { type: string }
        orderNo: { type: string }
        orderStatus: { type: string }
        storeId: { type: string }
        storeName: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DELIVERED, CANCELLED] }
        overdue: { type: boolean, description: 待接单超 15 分钟 / 配送中超 60 分钟 }
        courierName: { type: string, nullable: true }
        courierPhone: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        deliveredAt: { type: string, format: date-time, nullable: true }
        remark: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        receiver: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        payableCents: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              specText: { type: string }
              quantity: { type: integer }

    PaymentParams:
      type: object
      required: [provider, orderNo, outTradeNo, amountCents]
      properties:
        provider: { type: string, enum: [mock, wechat] }
        orderNo: { type: string }
        prepayId: { type: string, nullable: true }
        mockConfirmUrl: { type: string, nullable: true }
        outTradeNo: { type: string }
        amountCents: { type: integer }
        expiresAt: { type: string, format: date-time }
        payParams:
          type: object
          description: 微信支付 JSAPI 调起参数，直接传给 wx.requestPayment
          required: [timeStamp, nonceStr, package, signType, paySign]
          properties:
            timeStamp: { type: string }
            nonceStr: { type: string }
            package: { type: string, example: prepay_id=wx201410272009395522657a690389285100 }
            signType: { type: string, enum: [RSA] }
            paySign: { type: string }

    PaymentCallback:
      type: object
      required: [outTradeNo, amountCents]
      properties:
        outTradeNo: { type: string }
        transactionId: { type: string, description: 全局唯一，回调幂等依据 }
        status: { type: string, enum: [SUCCESS, FAILED] }
        amountCents: { type: integer }
        paidAt: { type: string, format: date-time }

    AfterSale:
      type: object
      required: [id, afterSaleNo, type, status, refundCents]
      properties:
        id: { type: string }
        afterSaleNo: { type: string, example: AS20261106000123456 }
        type: { type: string, enum: [REFUND_ONLY, RETURN_REFUND] }
        reason: { type: string }
        description: { type: string, nullable: true }
        evidence: { type: array, items: { type: string } }
        refundCents: { type: integer, description: 退款金额（不含运费） }
        status:
          type: string
          enum: [APPLIED, WAIT_BUYER_SHIP, WAIT_SELLER_RECEIVE, REFUNDING, COMPLETED, REJECTED]
        rejectReason: { type: string, nullable: true }
        buyerTrackingNo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        orderNo: { type: string, nullable: true }
        refund:
          type: object
          nullable: true
          properties:
            refundNo: { type: string }
            status: { type: string, enum: [PENDING, SUCCESS, FAILED] }
            channelStatus: { type: string, nullable: true }
            refundedAt: { type: string, format: date-time, nullable: true }

    ShipmentTrace:
      type: object
      required: [shipped, nodes, traceSource]
      properties:
        shipped: { type: boolean }
        expressName: { type: string, nullable: true }
        expressCode: { type: string, nullable: true }
        trackingNo: { type: string, nullable: true }
        traceSource: { type: string, enum: [INTERNAL, courier] }
        nodes:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              title: { type: string }
              desc: { type: string }

    Coupon:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [THRESHOLD, NO_THRESHOLD] }
        thresholdCents: { type: integer, description: 0 表示无门槛 }
        faceValueCents: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        remaining: { type: integer }
        claimedByMe: { type: integer }
        perLimit: { type: integer }
        canClaim: { type: boolean }

    MemberProfile:
      type: object
      required: [points, totalSpentCents, coupons]
      properties:
        nickname: { type: string, nullable: true }
        avatarKey: { type: string, nullable: true }
        points: { type: integer, description: 仅记录，不参与订单抵扣 }
        totalSpentCents: { type: integer, description: 成长值：累计实付，退款扣减 }
        level:
          type: object
          nullable: true
          properties:
            name: { type: string }
            discountRate: { type: number }
            thresholdCents: { type: integer }
        nextLevel:
          type: object
          nullable: true
          properties:
            name: { type: string }
            thresholdCents: { type: integer }
            remainCents: { type: integer }
        coupons:
          type: object
          properties:
            unused: { type: integer }
            used: { type: integer }
            expired: { type: integer }

    MemberLevelInput:
      type: object
      additionalProperties: false
      required: [name, thresholdCents, discountRate]
      properties:
        name: { type: string }
        thresholdCents: { type: integer, minimum: 0 }
        discountRate: { type: number, minimum: 0.01, maximum: 1 }

    PointsEntry:
      type: object
      properties:
        id: { type: string }
        delta: { type: integer }
        source: { type: string, enum: [ORDER_PAID, REFUND, ADMIN] }
        reason: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        balanceAfter: { type: integer }
        createdAt: { type: string, format: date-time }

    ReviewContext:
      type: object
      required: [id, title, reviewed]
      properties:
        id: { type: string }
        title: { type: string }
        specText: { type: string }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        quantity: { type: integer }
        reviewed: { type: boolean }
        orderStatus: { type: string }

    Review:
      type: object
      required: [id, rating, status]
      properties:
        id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        anonymous: { type: boolean }
        status: { type: string, enum: [PENDING, SHOWN, HIDDEN] }
        reply: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Address:
      type: object
      required: [id, receiver, phone, region, detail, isDefault]
      properties:
        id: { type: string }
        receiver: { type: string }
        phone: { type: string }
        region: { type: string }
        detail: { type: string }
        isDefault: { type: boolean }

    AddressInput:
      type: object
      additionalProperties: false
      required: [receiver, phone, region, detail]
      properties:
        receiver: { type: string }
        phone: { type: string, description: 11 位手机号 }
        region: { type: string }
        detail: { type: string }
        isDefault: { type: boolean }

    AdminProduct:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [ON_SALE, OFF_SHELF, SOLD_OUT] }
        categoryName: { type: string }
        mainImageKey: { type: string, nullable: true }
        priceMinCents: { type: integer }

        settings: { $ref: '#/components/schemas/MicroPageSettings' }
        updatedAt: { type: string, format: date-time }

    MicroLink:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [none, micro, product, category, search, seckill, coupon, store, cart, orders, mine, points, page]
        value: { type: string, nullable: true }

    ShopTabbarItem:
      type: object
      required: [key, text, link]
      properties:
        key: { type: string }
        text: { type: string, maxLength: 5 }
        iconKey: { type: string, nullable: true }
        activeIconKey: { type: string, nullable: true }
        link: { $ref: '#/components/schemas/MicroLink' }

    ShopTabbar:
      type: object
      required: [enabled, style, items]
      properties:
        enabled: { type: boolean }
        style:
          type: object
          properties:
            background: { type: string }
            color: { type: string }
            selectedColor: { type: string }
            borderTop: { type: boolean }
        items:
          type: array
          minItems: 2
          maxItems: 5
          items: { $ref: '#/components/schemas/ShopTabbarItem' }

    ShopShell:
      type: object
      required: [tabbar]
      properties:
        tabbar: { $ref: '#/components/schemas/ShopTabbar' }
        homeCode: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    LinkOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { type: string }
        hint: { type: string }

    PopupAd:
      type: object
      required: [id, name, imageKey, priority, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        imageKey: { type: string }
        alt: { type: string, nullable: true }
        link: { $ref: '#/components/schemas/MicroLink' }
        priority: { type: integer }
        enabled: { type: boolean }
        startAt: { type: string, format: date-time, nullable: true }
        endAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PopupAdInput:
      type: object
      required: [name, imageKey]
      properties:
        name: { type: string, maxLength: 20 }
        imageKey: { type: string }
        alt: { type: string, nullable: true, maxLength: 40 }
        link: { $ref: '#/components/schemas/MicroLink' }
        priority: { type: integer }
        enabled: { type: boolean }
        startAt: { type: string, format: date-time, nullable: true }
        endAt: { type: string, format: date-time, nullable: true }

      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/accounts/{id}/reset-password:
    post:
      tags: [admin-accounts]
      summary: 重置密码（同时清零失败次数与锁定）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        '200': { description: OK }

  /admin/logs:
    get:
      tags: [admin-logs]
      summary: 操作日志（按操作人 / 模块 / 关键词 / 时间分页）
      security: [{ adminToken: [] }]
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/OperationLog' }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }

  /admin/dashboard:
    get:
      tags: [admin-dashboard]
      summary: 数据概览：今日指标、待办、7 日趋势、热销商品
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }

  /telemetry/client-error:
    post:
      tags: [telemetry]
      summary: 客户端错误上报（无需登录，按来源/IP 限流）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source, message]
              properties:
                source: { type: string, enum: [admin, miniapp] }
                message: { type: string, maxLength: 200 }
                name: { type: string, maxLength: 200 }
                stack: { type: string, maxLength: 4000 }
                path: { type: string, maxLength: 500 }
                userAgent: { type: string, maxLength: 300 }
                requestId: { type: string, maxLength: 100 }
      responses:
        '204': { description: 已记录 }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/integration:
    get:
      tags: [admin-integration]
      summary: 集成配置（密钥只返回是否已配置与文件名）
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IntegrationConfig' }
    patch:
      tags: [admin-integration]
      summary: 修改集成配置（小程序 / 支付 / 订阅消息 / 域名）
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                miniappAppId: { type: string, maxLength: 64 }
                miniappAppSecret: { type: string, maxLength: 64, description: '32 位字母数字；空字符串表示清除' }
                paymentProvider: { type: string, enum: [mock, wechat] }
                wechatPayMchId: { type: string, maxLength: 64 }
                wechatPayCertSerial: { type: string, maxLength: 128 }
                wechatPayNotifyUrl: { type: string, maxLength: 300 }
                subscribeTemplateIds:
                  type: object
                  properties:
                    orderPaid: { type: string, maxLength: 64 }
                    orderShipped: { type: string, maxLength: 64 }
                    refundResult: { type: string, maxLength: 64 }
                    pickupReady: { type: string, maxLength: 64 }
                    pickupExpiring: { type: string, maxLength: 64 }
                    deliveryAccepted: { type: string, maxLength: 64 }
                    deliveryDone: { type: string, maxLength: 64 }
                subscribeTemplateFields:
                  type: object
                  description: '模板字段映射：场景 → { 微信字段名: 变量名 }'
                  additionalProperties:
                    type: object
                    additionalProperties: { type: string, maxLength: 64 }
                apiBaseUrl: { type: string, maxLength: 300 }
                businessDomain: { type: string, maxLength: 200 }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/integration/secrets/{field}:
    post:
      tags: [admin-integration]
      summary: 上传密钥或证书文件（base64，≤200KB）
      security: [{ adminToken: [] }]
      parameters:
        - { name: field, in: path, required: true, schema: { type: string, enum: [miniappUploadKey, wechatPayApiV3Key, wechatPayPrivateKey] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileName, contentBase64]
              properties:
                fileName: { type: string, maxLength: 200 }
                contentBase64: { type: string, maxLength: 400000 }
      responses:
        '201': { description: 已保存 }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [admin-integration]
      summary: 删除已上传的密钥或证书
      security: [{ adminToken: [] }]
      parameters:
        - { name: field, in: path, required: true, schema: { type: string, enum: [miniappUploadKey, wechatPayApiV3Key, wechatPayPrivateKey] } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }


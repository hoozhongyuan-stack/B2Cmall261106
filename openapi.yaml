    get:
      tags: [admin-miniapp]
      summary: 体验版二维码（base64 data URL）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/miniapp/releases/{id}/released:
    post:
      tags: [admin-miniapp]
      summary: 标记为已发布（审核与发布在微信后台完成）
      security: [{ adminToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }


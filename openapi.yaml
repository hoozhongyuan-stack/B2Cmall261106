          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 小程序用户令牌（scope=miniapp）
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 后台账号令牌（角色 SUPER/OPS/CS/WMS）

  responses:
    BadRequest:
      description: 参数校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突或库存不足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ShopConfig:
      type: object
      properties:
        shopName: { type: string }
        intro: { type: string }
        servicePhone: { type: string, nullable: true }
        freeThresholdCents: { type: integer }
        flatFreightCents: { type: integer }
        afterSaleDays: { type: integer }

    CartItem:
      type: object
      required: [id, skuId, quantity, checked, title, priceCents, subtotalCents]
      properties:
        id: { type: string }
        skuId: { type: string }
        quantity: { type: integer }
        checked: { type: boolean }
        title: { type: string }
        spec: { type: object, additionalProperties: { type: string } }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        available: { type: integer }
        subtotalCents: { type: integer }
        invalidReason: { type: string, nullable: true }

    PreviewRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        couponClaimId: { type: string, nullable: true }
        region: { type: string }

    OrderLine:
      type: object
      additionalProperties: false
      required: [skuId, quantity]
      properties:
        skuId: { type: string }
        quantity: { type: integer, minimum: 1 }

    PreviewItem:
      type: object
      properties:
        skuId: { type: string }
        title: { type: string }
        specText: { type: string }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        quantity: { type: integer }
        subtotalCents: { type: integer }

    CouponOption:
      type: object
      properties:
        claimId: { type: string }
        name: { type: string }
        faceValueCents: { type: integer }
        thresholdCents: { type: integer }
        usable: { type: boolean }
        expiresAt: { type: string, format: date-time }

    AmountBreakdown:
      type: object
      description: 金额快照，全部为整数分；payable = goods - memberDiscount - coupon + freight
      required: [goodsCents, memberDiscountCents, couponCents, freightCents, payableCents]
      properties:
        goodsCents: { type: integer }
        memberDiscountCents: { type: integer }
        couponCents: { type: integer }
        freightCents: { type: integer }
        payableCents: { type: integer }
        refundedCents: { type: integer }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        skuId: { type: string }
        title: { type: string }
        specText: { type: string }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        quantity: { type: integer }
        subtotalCents: { type: integer }

    Order:
      type: object
      required: [id, orderNo, status, amount, items]
      properties:
        id: { type: string }
        orderNo: { type: string, example: SY20261106093812 }
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, SHIPPED, COMPLETED, REFUNDING, REFUNDED, CLOSED]
        payDeadlineAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        shippedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        remark: { type: string, nullable: true }
        address:
          type: object
          properties:
            receiver: { type: string }
            phone: { type: string }
            region: { type: string }
            detail: { type: string }
        amount: { $ref: '#/components/schemas/AmountBreakdown' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        shipment:
          type: object
          nullable: true
          properties:
            expressName: { type: string }
            expressCode: { type: string }
            trackingNo: { type: string }
            shippedAt: { type: string, format: date-time }

    PaymentParams:
      type: object
      required: [provider, orderNo, outTradeNo, amountCents]
      properties:
        provider: { type: string, enum: [mock, wechat] }
        orderNo: { type: string }
        prepayId: { type: string, nullable: true }
        mockConfirmUrl: { type: string, nullable: true }
        outTradeNo: { type: string }
        amountCents: { type: integer }
        expiresAt: { type: string, format: date-time }

    PaymentCallback:
      type: object
      required: [outTradeNo, amountCents]
      properties:
        outTradeNo: { type: string }
        transactionId: { type: string, description: 全局唯一，回调幂等依据 }
        status: { type: string, enum: [SUCCESS, FAILED] }
        amountCents: { type: integer }
        paidAt: { type: string, format: date-time }

    AfterSale:
      type: object
      required: [id, afterSaleNo, type, status, refundCents]
      properties:
        id: { type: string }
        afterSaleNo: { type: string, example: AS20261106000123456 }
        type: { type: string, enum: [REFUND_ONLY, RETURN_REFUND] }
        reason: { type: string }
        description: { type: string, nullable: true }
        evidence: { type: array, items: { type: string } }
        refundCents: { type: integer, description: 退款金额（不含运费） }
        status:
          type: string
          enum: [APPLIED, WAIT_BUYER_SHIP, WAIT_SELLER_RECEIVE, REFUNDING, COMPLETED, REJECTED]
        rejectReason: { type: string, nullable: true }
        buyerTrackingNo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        orderNo: { type: string, nullable: true }
        refund:
          type: object
          nullable: true
          properties:
            refundNo: { type: string }
            status: { type: string, enum: [PENDING, SUCCESS, FAILED] }
            refundedAt: { type: string, format: date-time, nullable: true }

    ShipmentTrace:
      type: object
      required: [shipped, nodes, traceSource]
      properties:
        shipped: { type: boolean }
        expressName: { type: string, nullable: true }
        expressCode: { type: string, nullable: true }
        trackingNo: { type: string, nullable: true }
        traceSource: { type: string, enum: [INTERNAL, courier] }
        nodes:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              title: { type: string }
              desc: { type: string }

    Coupon:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [THRESHOLD, NO_THRESHOLD] }
        thresholdCents: { type: integer, description: 0 表示无门槛 }
        faceValueCents: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        remaining: { type: integer }
        claimedByMe: { type: integer }
        perLimit: { type: integer }
        canClaim: { type: boolean }

    MemberProfile:
      type: object
      required: [points, totalSpentCents, coupons]
      properties:
        nickname: { type: string, nullable: true }
        avatarKey: { type: string, nullable: true }
        points: { type: integer, description: 仅记录，不参与订单抵扣 }
        totalSpentCents: { type: integer, description: 成长值：累计实付，退款扣减 }
        level:
          type: object
          nullable: true
          properties:
            name: { type: string }
            discountRate: { type: number }
            thresholdCents: { type: integer }
        nextLevel:
          type: object
          nullable: true
          properties:
            name: { type: string }
            thresholdCents: { type: integer }
            remainCents: { type: integer }
        coupons:
          type: object
          properties:
            unused: { type: integer }
            used: { type: integer }
            expired: { type: integer }

    MemberLevelInput:
      type: object
      additionalProperties: false
      required: [name, thresholdCents, discountRate]
      properties:
        name: { type: string }
        thresholdCents: { type: integer, minimum: 0 }
        discountRate: { type: number, minimum: 0.01, maximum: 1 }

    PointsEntry:
      type: object
      properties:
        id: { type: string }
        delta: { type: integer }
        source: { type: string, enum: [ORDER_PAID, REFUND, ADMIN] }
        reason: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        balanceAfter: { type: integer }
        createdAt: { type: string, format: date-time }

    ReviewContext:
      type: object
      required: [id, title, reviewed]
      properties:
        id: { type: string }
        title: { type: string }
        specText: { type: string }
        imageKey: { type: string, nullable: true }
        priceCents: { type: integer }
        quantity: { type: integer }
        reviewed: { type: boolean }
        orderStatus: { type: string }

    Review:
      type: object
      required: [id, rating, status]
      properties:
        id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string, nullable: true }
        images: { type: array, items: { type: string } }
        anonymous: { type: boolean }
        status: { type: string, enum: [PENDING, SHOWN, HIDDEN] }
        reply: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Address:
      type: object
      required: [id, receiver, phone, region, detail, isDefault]
      properties:
        id: { type: string }
        receiver: { type: string }
        phone: { type: string }
        region: { type: string }
        detail: { type: string }
        isDefault: { type: boolean }

    AddressInput:
      type: object
      additionalProperties: false
      required: [receiver, phone, region, detail]
      properties:
        receiver: { type: string }
        phone: { type: string, description: 11 位手机号 }
        region: { type: string }
        detail: { type: string }
        isDefault: { type: boolean }

    AdminProduct:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string, enum: [ON_SALE, OFF_SHELF, SOLD_OUT] }
        categoryName: { type: string }
        mainImageKey: { type: string, nullable: true }
        priceMinCents: { type: integer }
        priceMaxCents: { type: integer }
        soldCount: { type: integer }
        stock: { type: integer, description: 所有 SKU 库存合计 }
        skuCount: { type: integer }
        createdAt: { type: string, format: date-time }

    AdminSku:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        specJson: { type: object, additionalProperties: { type: string } }
        priceCents: { type: integer }
        originCents: { type: integer, nullable: true }
        stock: { type: integer }
        status: { type: string, enum: [ON_SALE, OFF_SHELF, SOLD_OUT] }

    AdminProductDetail:
      type: object
      required: [id, title, skus]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string, nullable: true }
        categoryId: { type: string }
        mainImageKey: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        status: { type: string, enum: [ON_SALE, OFF_SHELF, SOLD_OUT] }
        sort: { type: integer }
        priceMinCents: { type: integer }
        priceMaxCents: { type: integer }
        soldCount: { type: integer }
        skus:
          type: array
          items: { $ref: '#/components/schemas/AdminSku' }
        tags:
          type: array
          items: { $ref: '#/components/schemas/AdminTag' }

    AdminProductInput:
      type: object
      additionalProperties: false
      required: [title, categoryId, skus]
      properties:
        title: { type: string }
        subtitle: { type: string }
        categoryId: { type: string }
        mainImageKey: { type: string }
        detail: { type: string }
        status: { type: string, enum: [ON_SALE, OFF_SHELF] }
        sort: { type: integer }
        skus:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [specJson, priceCents, stock]
            properties:
              code: { type: string, description: 缺省自动生成 }
              specJson: { type: object, additionalProperties: { type: string } }
              priceCents: { type: integer, minimum: 1 }
              originCents: { type: integer, minimum: 0 }
              stock: { type: integer, minimum: 0 }
              status: { type: string, enum: [ON_SALE, OFF_SHELF, SOLD_OUT] }

    AdminCategory:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        parentId: { type: string, nullable: true }
        sort: { type: integer }
        productCount: { type: integer }
        children:
          type: array
          items: { $ref: '#/components/schemas/AdminCategory' }

    AdminTag:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        productId: { type: string, nullable: true }
        productTitle: { type: string, nullable: true }

    ShopSettings:
      type: object
      properties:
        shopName: { type: string }
        intro: { type: string, nullable: true }
        servicePhone: { type: string, nullable: true }
        logoKey: { type: string, nullable: true }
        freeThresholdCents: { type: integer }
        flatFreightCents: { type: integer }
        payTimeoutMinutes: { type: integer }
        afterSaleDays: { type: integer }
        autoConfirmDays: { type: integer }
        miniappAppId: { type: string, nullable: true }
        regions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              regionName: { type: string }
              freightCents: { type: integer }

    Asset:
      type: object
      properties:
        id: { type: string }
        key: { type: string }
        url: { type: string }
        size: { type: integer }
        mimeType: { type: string, nullable: true }
        group: { type: string }
        refCount: { type: integer }
        createdAt: { type: string, format: date-time }

    AdminAccount:
      type: object
      properties:
        id: { type: string }
        account: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [SUPER, OPS, CS, WMS] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        failCount: { type: integer }
        lockedUntil: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    OperationLog:
      type: object
      properties:
        id: { type: string }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        beforeJson: { nullable: true }
        afterJson: { nullable: true }
        ip: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [today, pending, trend, topProducts]
      properties:
        today:
          type: object
          properties:
            paidOrderCount: { type: integer }
            paidAmountCents: { type: integer }
            refundedCents: { type: integer }
            newCustomerCount: { type: integer }
        pending:
          type: object
          properties:
            toShipCount: { type: integer }
            afterSaleCount: { type: integer }
            pendingReviewCount: { type: integer }
        trend:
          type: array
          items:
            type: object
            properties:
              date: { type: string, example: '2026-11-06' }
              orderCount: { type: integer }
              paidAmountCents: { type: integer }
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              title: { type: string }
              quantity: { type: integer }
              amountCents: { type: integer }

    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: ORDER_STATE_CONFLICT }
        message: { type: string }
        data: { nullable: true }
        requestId: { type: string }

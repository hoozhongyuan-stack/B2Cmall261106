      security: [{ adminToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MiniappReadiness' }

  /admin/miniapp/releases:
    get:
      tags: [admin-miniapp]
      summary: 发布记录（最近 20 条）
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/MiniappRelease' }
    post:
      tags: [admin-miniapp]

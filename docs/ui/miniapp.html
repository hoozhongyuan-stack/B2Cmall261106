<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F6F6F5">
<title>山野商城 · 小程序设计稿 17 屏 v3</title>
<style>
  :root{
    --canvas:#F6F6F5;
    --white:#FFFFFF;
    --sand:#F4F1EB;
    --ink:#16181A;
    --ink-2:#55585C;
    --ink-3:#8E9399;
    --line:#EBEBE8;
    --line-2:#DEDEDA;
    --brand:#E2231A;
    --brand-2:#C21B14;
    --brand-soft:#FDEDEB;
    --price:#E2231A;
    --price-soft:#FDEDEB;
    --gold:#BC8A2E;
    --gold-soft:#FBF3E2;
    --ok:#1F7A4C;
    --warn:#A9691A;
    --danger:#C22C1E;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
    --sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#EFEFEE;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.65;}
  button{font-family:inherit;}

  .topbar{
    position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:12px 24px;
    background:rgba(250,250,249,.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(235,235,232,.9);
  }
  .topbar .bm{display:flex;align-items:center;gap:9px;}
  .topbar .sq{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;}
  .topbar .tt{font-family:var(--serif);font-size:14px;letter-spacing:.08em;}
  .topbar .sp{flex:1;}
  .topbar a{font-size:12px;color:var(--ink-3);text-decoration:none;padding:6px 10px;border-radius:8px;transition:background-color 160ms var(--ease),color 160ms var(--ease);}
  .topbar a:hover{background:var(--brand-soft);color:var(--brand);}
  .topbar a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .wrap{display:grid;grid-template-columns:212px minmax(0,1fr);align-items:start;}
  aside.rail{position:sticky;top:49px;height:calc(100vh - 49px);overflow-y:auto;padding:22px 14px 40px;border-right:1px solid var(--line);background:#FAFAF9;}
  .rail h1{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 2px;letter-spacing:.04em;}
  .rail .cnt{font-size:11px;color:var(--ink-3);margin-bottom:16px;letter-spacing:.04em;}
  .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A2A6AB;margin:16px 0 6px;padding-left:8px;font-weight:600;}
  .rail nav button{
    display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:7px 9px;border-radius:8px;font-size:12.5px;color:var(--ink-3);line-height:1.4;
    transition:background-color 160ms var(--ease),color 160ms var(--ease);
  }
  .rail nav button .id{font-family:var(--mono);font-size:9.5px;opacity:.55;}
  .rail nav button:hover{background:var(--brand-soft);color:var(--brand);}
  .rail nav button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:600;}
  .rail nav button[aria-current="true"] .id{opacity:.75;}
  .rail nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  main{padding:30px 32px 90px;min-width:0;}
  .stage{display:grid;grid-template-columns:375px minmax(240px,1fr);gap:36px;align-items:start;}

  /* ---------- device ---------- */
  .device{
    width:375px;height:812px;border-radius:44px;background:#fff;position:relative;
    box-shadow:0 40px 90px -40px rgba(16,24,21,.42), 0 0 0 1px rgba(16,24,21,.06);
    overflow:hidden;display:flex;flex-direction:column;
    transition:opacity 200ms var(--ease),transform 200ms var(--ease);
  }
  .device.swap{opacity:0;transform:translateY(8px) scale(.995);}
  .statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;font-weight:600;color:var(--ink);flex:0 0 auto;background:transparent;}
  .statusbar .r{display:flex;gap:5px;align-items:center;}

  .navbar{height:44px;display:flex;align-items:center;padding:0 12px;gap:6px;flex:0 0 auto;background:transparent;}
  .navbar .ib{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:0;background:none;border-radius:50%;color:var(--ink-2);cursor:pointer;transition:background-color 160ms var(--ease);}
  .navbar .ib:hover{background:var(--sand);}
  .navbar .ib:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .navbar .title{flex:1;text-align:center;font-size:14.5px;font-weight:600;letter-spacing:.02em;}

  .screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:var(--canvas);scrollbar-width:none;position:relative;display:flex;flex-direction:column;}
  .screen::-webkit-scrollbar{display:none;}
  .screen > *{flex:0 0 auto;}
  .screen.has-bar{padding-bottom:86px;}
  .screen.has-bar.has-tab{padding-bottom:150px;}
  .barhost{position:absolute;left:0;right:0;bottom:0;z-index:6;}
  .barhost.above-tab{bottom:64px;}

  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:64px;background:#fff;
    border-top:1px solid var(--line);display:flex;align-items:center;padding:0 6px 6px;z-index:3;
  }
  .tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:#9AA0A6;position:relative;padding-top:8px;}
  .tabbar div.on{color:var(--brand);font-weight:600;}
  .tabbar .ti{width:26px;height:24px;display:flex;align-items:center;justify-content:center;}
  .tabbar .b{position:absolute;top:3px;right:calc(50% - 20px);min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--brand);color:#fff;font-size:9px;line-height:15px;text-align:center;font-weight:600;}

  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block;}
  .icon.sm{width:16px;height:16px;}
  .icon.lg{width:28px;height:28px;}

  /* ---------- shared pieces ---------- */
  .pad{padding:0 22px;}
  .block{background:var(--white);border-radius:16px;}
  .soft{background:var(--sand);border-radius:16px;}

  .cartblock,.ocard,.chap,.amountblock,.setrows,.ordblock,.listblock,.ordernav,.adrow,.fieldblock,.addrblock,.invzone{
    box-shadow:0 6px 18px -14px rgba(20,22,24,.22);
  }

  .reveal{opacity:0;transform:translateY(6px);}
  .reveal.in{opacity:1;transform:none;}

  .homehead{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 22px 0;}
  .homehead .l .wm{font-family:var(--serif);font-size:24px;letter-spacing:.2em;font-weight:600;line-height:1.1;}
  .homehead .l .eb{font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);margin-top:7px;}
  .circlebtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--white);box-shadow:0 6px 18px -10px rgba(16,24,21,.3);display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;}
  .circlebtn:hover{background:var(--brand-soft);color:var(--brand);}
  .circlebtn:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}

  .hero{position:relative;margin:18px 0 0;height:372px;overflow:hidden;background:#EDE7DA;}
  .hero img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0) 42%,rgba(12,26,20,.55) 100%);}
  .hero .txt{position:absolute;left:22px;right:22px;bottom:22px;color:#fff;}
  .hero .eb{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;opacity:.9;margin-bottom:12px;}
  .hero h3{font-family:var(--serif);font-size:33px;line-height:1.24;margin:0 0 16px;font-weight:600;letter-spacing:-.005em;text-wrap:balance;text-shadow:0 1px 20px rgba(12,26,20,.18);}
  .hero .cta{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:#fff;background:var(--brand);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(226,35,26,.8);transition:background-color 200ms var(--ease),transform 200ms var(--ease);}
  .hero .cta:hover{background:var(--brand-2);transform:translateY(-1px);}
  .hero .cta:focus-visible{outline:2px solid #fff;outline-offset:3px;}

  .catrow{display:flex;gap:26px;padding:28px 22px 6px;overflow-x:auto;scrollbar-width:none;}
  .catrow::-webkit-scrollbar{display:none;}
  .catrow button{background:none;border:0;padding:0;cursor:pointer;text-align:left;}
  .catrow button .i{display:block;font-family:var(--mono);font-size:9px;color:#B0B6B0;letter-spacing:.08em;margin-bottom:5px;}
  .catrow button .t{font-size:13px;color:var(--ink-2);white-space:nowrap;letter-spacing:.06em;}
  .catrow button.on .t{color:var(--brand);font-weight:650;}
  .catrow button.on .i{color:var(--brand);}
  .catrow button:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px;}

  .edhead{display:flex;align-items:baseline;gap:10px;padding:36px 22px 18px;}
  .edhead .idx{font-family:var(--mono);font-size:9.5px;color:#B0B6B0;letter-spacing:.1em;}
  .edhead h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:0;letter-spacing:.02em;}
  .edhead .more{margin-left:auto;background:none;border:0;font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;cursor:pointer;padding:4px;border-radius:6px;}
  .edhead .more:hover{color:var(--brand);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px 16px;padding:0 22px;}
  .pcard{background:none;border:0;padding:0;text-align:left;cursor:pointer;}
  .pcard .thumb{aspect-ratio:1;background:#F0EFEC;overflow:hidden;border-radius:4px;}
  .pcard .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 400ms var(--ease);}
  .pcard:hover .thumb img{transform:scale(1.03);}
  .pcard:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px;}
  .pcard .nm{font-size:12.5px;font-weight:600;line-height:1.5;margin-top:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:37px;letter-spacing:.01em;}
  .pcard .cap{font-size:10px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em;}
  .pcard .pr{font-size:17px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;margin-top:7px;letter-spacing:-.01em;}
  .pcard .pr .c{font-size:10.5px;margin-right:1px;font-weight:500;}
  .pcard .out{font-size:10px;color:var(--ink-3);margin-top:2px;display:block;}

  .chip{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;line-height:1.6;padding:1px 6px;border-radius:4px;white-space:nowrap;}
  .chip.red{background:var(--brand-soft);color:var(--brand);}
  .chip.gold{background:var(--gold-soft);color:var(--gold);}
  .chip.solid{background:var(--brand);color:#fff;}
  .chip.line{background:#F4F1EB;color:#8E9399;}

  .couponstrip{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;margin:16px 22px 0;padding:14px 16px;border-radius:14px;color:#fff;
    background:linear-gradient(120deg,#EE3A24 0%,#E2231A 52%,#B7170F 100%);box-shadow:0 14px 28px -16px rgba(226,35,26,.85);}
  .couponstrip::after{content:"";position:absolute;right:-24px;top:-38px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);}
  .couponstrip .t{font-size:12.5px;font-weight:700;letter-spacing:.02em;}
  .couponstrip .d{font-size:9.5px;color:rgba(255,255,255,.8);letter-spacing:.02em;margin-top:2px;}
  .couponstrip .go{position:relative;margin-left:auto;font-size:10.5px;font-weight:700;color:#B7170F;background:#FBE3B0;border:0;border-radius:999px;padding:6px 14px;cursor:pointer;}
  .couponstrip .go:hover{background:#F8D794;}
  .couponstrip .go:focus-visible{outline:2px solid #fff;outline-offset:2px;}

  .promise{display:flex;justify-content:center;gap:14px;padding:34px 22px 128px;color:#A2A6AB;font-size:10px;letter-spacing:.1em;}
  .promise i{font-style:normal;color:#CFCAC0;}

  /* category */
  .catlay{display:flex;min-height:100%;}
  .catlay .left{width:86px;flex:0 0 auto;padding:14px 0 60px;}
  .catlay .left button{display:block;width:100%;text-align:left;padding:13px 0 13px 22px;background:none;border:0;font-size:12px;color:#A2A6AB;cursor:pointer;position:relative;letter-spacing:.04em;}
  .catlay .left button.on{color:var(--ink);font-weight:650;}
  .catlay .left button.on::before{content:"";position:absolute;left:12px;top:17px;bottom:17px;width:2px;border-radius:1px;background:var(--brand);}
  .catlay .right{flex:1;min-width:0;padding:8px 22px 120px 4px;}
  .catlay .right h4{font-family:var(--serif);font-size:22px;font-weight:600;margin:6px 0 3px;letter-spacing:.01em;}
  .catlay .right .cnt{font-size:10px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:20px;}
  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px 12px;}
  .catgrid .mini{background:none;border:0;padding:0;text-align:left;cursor:pointer;}
  .catgrid .mini img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#F0EFEC;border-radius:4px;}
  .catgrid .mini span{display:block;font-size:11px;padding:8px 0 0;color:var(--ink-2);}

  /* search */
  .searchhero{padding:14px 22px 8px;}
  .searchhero h3{font-family:var(--serif);font-size:29px;font-weight:600;margin:0 0 20px;letter-spacing:-.01em;}
  .searchline{display:flex;align-items:center;gap:9px;padding:0 0 11px;border-bottom:1px solid #DEDEDA;color:var(--ink-3);}
  .searchline input{flex:1;border:0;background:none;outline:0;font-size:14px;font-family:inherit;color:var(--ink);letter-spacing:.01em;}
  .searchline input::placeholder{color:#B4B8BD;}
  .textchips{display:flex;flex-wrap:wrap;gap:16px;padding:0 22px;}
  .textchips button{background:none;border:0;padding:0;font-size:12px;color:var(--ink-2);cursor:pointer;letter-spacing:.02em;}
  .textchips button:hover{color:var(--brand);}
  .textchips button:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:3px;}

  /* list */
  .filterline{display:flex;gap:20px;padding:4px 22px 14px;}
  .filterline button{background:none;border:0;padding:0;font-size:12px;color:#8E9399;cursor:pointer;letter-spacing:.04em;}
  .filterline button.on{color:var(--ink);font-weight:650;}
  .filterline button:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}
  .filterline .sp{flex:1;}

  /* product detail */
  .pd-img{width:375px;height:404px;background:#F0EFEC;}
  .pd-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .pd-body{padding:26px 22px 30px;}
  .pd-price{display:flex;align-items:baseline;gap:9px;margin-bottom:12px;}
  .pd-price b{font-size:27px;color:var(--price);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .pd-price b .c{font-size:13px;margin-right:2px;font-weight:500;}
  .pd-price .was{font-size:11px;color:#B4B8BD;text-decoration:line-through;}
  .pd-name{font-family:var(--serif);font-size:23px;line-height:1.36;font-weight:600;margin:0 0 8px;letter-spacing:-.005em;}
  .pd-cap{font-size:11px;color:var(--ink-3);margin:0 0 16px;letter-spacing:.02em;}
  .stocknote{font-size:11px;color:var(--price);letter-spacing:.02em;margin-bottom:20px;}
  .specrows{background:var(--sand);border-radius:16px;padding:6px 18px;margin-bottom:14px;}
  .specrows .row{display:flex;gap:16px;padding:13px 0;font-size:12px;}
  .specrows .row:not(:last-child){border-bottom:1px solid rgba(220,213,197,.55);}
  .specrows .k{width:44px;color:var(--ink-3);flex:0 0 auto;font-size:11px;letter-spacing:.04em;}
  .specrows .v{flex:1;color:var(--ink-2);}
  .selrow{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:16px;padding:15px 18px;margin-bottom:26px;font-size:12px;color:var(--ink-2);}
  .selrow button{background:none;border:0;color:var(--brand);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 4px;}
  .revs{padding:0 22px 30px;}
  .revs .h{display:flex;justify-content:space-between;align-items:baseline;padding:0 0 12px;}
  .revs .h b{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:.02em;}
  .revs .h span{font-size:10.5px;color:var(--ink-3);}
  .rev{padding:14px 0;}
  .rev:not(:last-child){border-bottom:1px solid rgba(236,231,219,.9);}
  .rev .who{font-size:11px;color:var(--ink-3);margin-bottom:5px;display:flex;gap:8px;align-items:center;}
  .rev .who b{color:var(--ink-2);font-weight:600;}
  .rev .txt{font-size:12px;color:var(--ink-2);line-height:1.65;}
  .stars{display:inline-flex;gap:1.5px;color:#C08F2E;}
  .bottombar{flex:0 0 auto;height:72px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 -14px 34px -22px rgba(16,24,21,.26);display:flex;align-items:center;gap:10px;padding:0 16px;}
  .bottombar .icobtn{width:46px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font-size:9.5px;color:#8C948E;cursor:pointer;}
  .bottombar .icobtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px;}
  .bottombar .grow{flex:1;}
  .btn{border:0;border-radius:999px;padding:12px 22px;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.02em;transition:background-color 160ms var(--ease),transform 120ms var(--ease);}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-2);}
  .btn.primary:active{transform:scale(.985);}
  .btn.sand{background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);}
  .btn.sand:hover{color:var(--brand);box-shadow:inset 0 0 0 1px rgba(226,35,26,.45);}
  .btn.dark{background:#2A2C2E;color:#fff;}
  .btn.dark:hover{background:#1A1C1E;}
  .btn.line{background:var(--white);color:var(--ink-2);box-shadow:inset 0 0 0 1px rgba(16,24,21,.1);}
  .btn.line:hover{color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);}
  .btn[disabled]{background:#EDE9DF;color:#B0B6B0;cursor:not-allowed;}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:3px;}
  .btn.sm{padding:7px 16px;font-size:11.5px;}

  /* sheet */
  .sheetwrap{position:absolute;inset:0;background:rgba(14,26,21,.4);display:flex;align-items:flex-end;z-index:4;}
  .sheet{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:10px 22px 24px;}
  .sheet .grab{width:34px;height:4px;border-radius:2px;background:#E2DDD1;margin:0 auto 18px;}
  .sheet .skuh{display:flex;gap:14px;margin-bottom:22px;}
  .sheet .skuh img{width:74px;height:74px;border-radius:6px;object-fit:cover;background:#F0EFEC;}
  .sheet .skuh .r{flex:1;padding-top:2px;}
  .sheet .skuh .p{font-size:22px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.02em;}
  .sheet .skuh .s{font-size:11px;color:var(--ink-3);margin-top:6px;line-height:1.6;}
  .opt-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8E9399;margin-bottom:10px;}
  .opts{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;}
  .opts button{border:0;background:var(--sand);border-radius:10px;padding:10px 16px;font-size:12px;color:var(--ink-2);cursor:pointer;transition:background-color 160ms var(--ease),color 160ms var(--ease);}
  .opts button.sel{background:var(--brand);color:#fff;font-weight:600;}
  .opts button[disabled]{background:#F7F4EC;color:#C4C9C3;cursor:not-allowed;text-decoration:line-through;}
  .opts button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .qty{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .qty .lbl{font-size:12px;color:var(--ink-2);}
  .stepper{display:flex;align-items:center;background:var(--sand);border-radius:999px;overflow:hidden;}
  .stepper button{width:34px;height:32px;background:none;border:0;font-size:15px;color:var(--ink-2);cursor:pointer;}
  .stepper button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
  .stepper span{width:36px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;}

  /* cart */
  .cartblock{background:var(--white);border-radius:16px;padding:14px;margin:0 16px 10px;display:flex;gap:12px;}
  .check{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px #D8D8D4;flex:0 0 auto;margin-top:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;transition:background-color 160ms var(--ease),box-shadow 160ms var(--ease);}

  .cartblock img{width:74px;height:74px;border-radius:6px;object-fit:cover;background:#F0EFEC;flex:0 0 auto;}

  .cartblock .nm{font-size:12.5px;font-weight:600;line-height:1.5;margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .cartblock .sp{font-size:10px;color:#8E9399;letter-spacing:.02em;}
  .cartblock .bot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}

  .stepper.mini button{width:26px;height:26px;font-size:13px;}

  .invzone{background:var(--sand);border-radius:16px;margin:14px 16px 0;padding:14px 16px;}
  .invzone .h{display:flex;justify-content:space-between;font-size:10.5px;color:#8E9399;margin-bottom:10px;letter-spacing:.04em;}
  .invzone .h button{background:none;border:0;color:var(--brand);font-size:10.5px;cursor:pointer;}
  .invzone .row{display:flex;gap:12px;align-items:center;padding:4px 0;}
  .invzone img{width:52px;height:52px;border-radius:5px;object-fit:cover;filter:grayscale(.7);opacity:.6;}
  .invzone .t{font-size:11.5px;color:#8C948E;line-height:1.6;}
  .checkoutbar{flex:0 0 auto;height:70px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 -14px 34px -22px rgba(16,24,21,.26);display:flex;align-items:center;padding:0 18px;gap:12px;}
  .checkoutbar .sum{margin-left:auto;text-align:right;font-size:10px;color:var(--ink-3);}
  .checkoutbar .sum b{display:block;font-size:20px;color:var(--price);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.02em;}

  /* checkout */
  .addrblock{background:var(--white);border-radius:16px;margin:6px 16px 10px;padding:17px 18px;cursor:pointer;border:0;width:calc(100% - 32px);text-align:left;font-family:inherit;}
  .addrblock .t{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:650;margin-bottom:6px;letter-spacing:.01em;}
  .addrblock .tag{font-size:9px;letter-spacing:.08em;color:var(--brand);background:var(--brand-soft);border-radius:4px;padding:2px 6px;font-weight:600;}
  .addrblock .d{font-size:11.5px;color:var(--ink-3);line-height:1.65;}
  .addrblock:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
  .ordblock{background:var(--white);border-radius:16px;margin:0 16px 10px;padding:6px 18px;}
  .ordline{display:flex;gap:12px;align-items:center;padding:12px 0;}
  .ordline:not(:last-child){border-bottom:1px solid rgba(236,231,219,.85);}
  .ordline img{width:56px;height:56px;border-radius:5px;object-fit:cover;background:#F0EFEC;flex:0 0 auto;}
  .ordline .i{flex:1;min-width:0;}
  .ordline .n{font-size:12px;font-weight:600;line-height:1.5;}
  .ordline .s{font-size:10px;color:#8E9399;margin-top:2px;}
  .ordline .p{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .ordline .p span{display:block;font-size:10px;color:#8E9399;margin-top:2px;}
  .setrows{background:var(--white);border-radius:16px;margin:0 16px 10px;padding:4px 18px;}
  .setrow{display:flex;align-items:center;gap:12px;padding:14px 0;font-size:12px;}
  .setrow:not(:last-child){border-bottom:1px solid rgba(236,231,219,.85);}
  .setrow .k{color:var(--ink-3);width:56px;flex:0 0 auto;font-size:11px;letter-spacing:.04em;}
  .setrow .v{flex:1;text-align:right;color:var(--ink-2);}
  .setrow .v.brand{color:var(--price);font-weight:600;}
  .setrow input{flex:1;border:0;background:none;outline:0;text-align:right;font-size:12px;font-family:inherit;color:var(--ink-2);}
  .amountblock{background:var(--white);border-radius:16px;margin:0 16px;padding:16px 18px;}
  .ar{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;color:var(--ink-2);}
  .ar .n{font-variant-numeric:tabular-nums;}
  .ar.minus .n{color:var(--price);}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid rgba(236,231,219,.9);}
  .total .l{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;}
  .total .n{font-size:22px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .tiny{font-size:10px;color:#A2A6AB;text-align:right;margin-top:6px;}

  /* pay result */
  .payres{display:flex;flex-direction:column;align-items:center;padding:76px 26px 0;text-align:center;}
  .payres .ring{width:78px;height:78px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .payres h3{font-family:var(--serif);font-size:27px;font-weight:600;margin:0 0 10px;letter-spacing:.01em;}
  .payres .amt{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-bottom:8px;}
  .payres .sub{font-size:10.5px;color:#8E9399;letter-spacing:.04em;margin-bottom:34px;}
  .payres .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
  .subcard{margin:32px 16px 0;background:var(--sand);border-radius:16px;padding:18px;}
  .subcard .t{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8E9399;margin-bottom:7px;}
  .subcard .d{font-size:12px;color:var(--ink-2);line-height:1.65;}

  /* orders */
  .segpill{display:inline-flex;background:var(--sand);border-radius:999px;padding:3px;margin:0 22px 18px;gap:2px;}
  .segpill button{border:0;background:none;font-size:11.5px;color:#8C948E;padding:6px 13px;border-radius:999px;cursor:pointer;letter-spacing:.02em;}
  .segpill button.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:0 2px 8px -4px rgba(16,24,21,.24);}
  .segpill button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .ocard{background:var(--white);border-radius:16px;margin:0 16px 12px;overflow:hidden;}
  .ocard .h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px;font-size:10.5px;color:#8E9399;letter-spacing:.02em;}
  .ocard .h .st{color:var(--brand);font-weight:650;font-size:11.5px;}
  .ocard .h .st.warn{color:var(--warn);}
  .ocard .item{display:flex;gap:12px;padding:12px 16px;}
  .ocard .item img{width:64px;height:64px;border-radius:5px;object-fit:cover;background:#F0EFEC;}
  .ocard .item .i{flex:1;min-width:0;}
  .ocard .item .n{font-size:12px;font-weight:600;line-height:1.5;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .ocard .item .s{font-size:10px;color:#8E9399;margin-top:3px;}
  .ocard .item .p{text-align:right;font-size:10px;color:#8E9399;}
  .ocard .item .p b{display:block;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;font-weight:650;}
  .ocard .f{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:4px 16px 16px;}
  .ocard .f .sum{margin-right:auto;font-size:10px;color:#8E9399;}
  .ocard .f .sum b{color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums;font-weight:650;}

  /* order detail */
  .statushead{background:var(--brand);color:#fff;margin:0 14px 12px;border-radius:20px;padding:24px 22px 26px;}
  .statushead .eb{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-bottom:8px;}
  .statushead .s{font-family:var(--serif);font-size:25px;font-weight:600;margin-bottom:6px;letter-spacing:.01em;}
  .statushead .d{font-size:11px;opacity:.76;}
  .statushead.warn{background:#8B5A16;}
  .chap{background:var(--white);border-radius:16px;margin:0 14px 10px;padding:16px 18px;}
  .chap .ct{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8E9399;margin-bottom:10px;}
  .chap .cr{display:flex;justify-content:space-between;gap:16px;font-size:11.5px;padding:4px 0;color:var(--ink-2);}
  .chap .cr .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-3);}
  .chap .cr.blue{color:var(--ink-3);font-size:11px;line-height:1.65;}
  .copybtn{background:none;border:0;color:var(--brand);font-size:10px;cursor:pointer;padding:1px 5px;}
  .tlwrap{padding:2px 0 4px;}
  .tl{display:flex;gap:11px;padding-bottom:18px;position:relative;}
  .tl:not(:last-child)::before{content:"";position:absolute;left:4.5px;top:12px;bottom:0;width:1px;background:#EDE8DC;}
  .tl .dot{width:10px;height:10px;border-radius:50%;background:#EDE8DC;flex:0 0 auto;margin-top:1px;}
  .tl .dot.on{background:var(--brand);}
  .tl .c{flex:1;font-size:11px;color:#8E9399;line-height:1.55;}
  .tl .c b{display:block;font-size:12px;color:var(--ink);font-weight:600;margin-bottom:2px;}
  .tl .t{font-size:9.5px;color:#B4B8BD;white-space:nowrap;}

  /* after sale */
  .radiocards{display:grid;gap:9px;margin-bottom:18px;}
  .radiocard{display:flex;gap:11px;align-items:flex-start;padding:15px 16px;border-radius:14px;background:var(--white);cursor:pointer;}
  .radiocard.on{background:var(--brand-soft);}
  .radiocard .rd{width:15px;height:15px;border-radius:50%;background:#EDEBE8;flex:0 0 auto;margin-top:2px;}
  .radiocard.on .rd{background:var(--brand);box-shadow:inset 0 0 0 3px var(--brand-soft);}
  .radiocard .t{font-size:12.5px;font-weight:650;letter-spacing:.01em;}
  .radiocard .d{font-size:10.5px;color:#8E9399;margin-top:3px;line-height:1.6;}
  .fieldblock{background:var(--white);border-radius:16px;padding:6px 18px;margin-bottom:10px;}
  .frow{display:flex;align-items:center;gap:12px;padding:15px 0;font-size:11.5px;}
  .frow:not(:last-child){border-bottom:1px solid rgba(236,231,219,.85);}
  .frow .k{color:var(--ink-3);width:62px;flex:0 0 auto;font-size:11px;letter-spacing:.03em;}
  .frow .v{flex:1;text-align:right;color:var(--ink-2);}
  .frow input{flex:1;border:0;background:none;outline:0;text-align:right;font-size:12.5px;font-family:inherit;color:var(--ink);font-variant-numeric:tabular-nums;}
  .frow textarea{flex:1;border:0;background:none;outline:0;font-size:11.5px;font-family:inherit;resize:none;min-height:50px;color:var(--ink-2);line-height:1.6;}
  .uploader{display:flex;gap:9px;}
  .upl{width:66px;height:66px;border-radius:8px;background:var(--sand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8E9399;font-size:9.5px;cursor:pointer;border:0;}
  .upl:hover{background:#EDE6D7;color:var(--ink-2);}
  .upl:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .upl img{width:100%;height:100%;object-fit:cover;border-radius:8px;}

  /* review */
  .rate{padding:28px 22px 8px;text-align:center;}
  .rate .t{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:18px;letter-spacing:.02em;}
  .rate .stars{display:flex;justify-content:center;gap:12px;margin-bottom:8px;}
  .rate .star{width:34px;height:34px;color:#E2DDD1;background:none;border:0;cursor:pointer;padding:0;transition:color 160ms var(--ease),transform 160ms var(--ease);}
  .rate .star.on{color:#C08F2E;}
  .rate .star:hover{transform:scale(1.08);}
  .rate .star:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px;}
  .rate .hint{font-size:10.5px;color:#8E9399;letter-spacing:.04em;}

  /* mine */
  .minehead{background:#fff;border-radius:0 0 22px 22px;padding:18px 20px 18px;margin-bottom:14px;}
  .minehead .top{display:flex;align-items:center;gap:12px;}
  .minehead .av{width:52px;height:52px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;}

    background:linear-gradient(128deg,#EE3A24 0%,#E2231A 46%,#B7170F 100%);
    box-shadow:0 14px 30px -16px rgba(226,35,26,.75);}

  .lr:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;}
  .lr .v{margin-left:auto;font-size:10.5px;color:#8E9399;}

  /* address */
  .adrow{background:var(--white);border-radius:16px;margin:0 16px 10px;padding:16px 18px;display:flex;gap:12px;align-items:flex-start;}
  .adrow .c{flex:1;min-width:0;}
  .adrow .n{font-size:12.5px;font-weight:650;margin-bottom:5px;}
  .adrow .n .tag{margin-left:7px;font-size:9px;color:var(--brand);background:var(--brand-soft);border-radius:4px;padding:1px 6px;font-weight:600;letter-spacing:.06em;}
  .adrow .d{font-size:11px;color:#8E9399;line-height:1.65;}
  .adrow button{background:none;border:0;color:var(--brand);font-size:10.5px;cursor:pointer;padding:2px 4px;}

  .emptybox{padding:70px 30px;text-align:center;color:#8E9399;font-size:12px;}
  svg.sprite{display:none;}

  @media(max-width:900px){
    .wrap{grid-template-columns:1fr;}
    aside.rail{position:static;height:auto;border-right:0;border-bottom:1px solid rgba(236,231,219,.8);}
    .rail nav{display:flex;flex-wrap:wrap;gap:4px;}
    .rail nav button{width:auto;}
    .grp{width:100%;margin-top:10px;}
    .stage{grid-template-columns:1fr;justify-items:center;}
    main{padding:20px 14px 60px;}
    .notes{max-width:375px;}
  }

  /* notes */
  .notes{padding-top:4px;min-width:0;}
  .nid{font-family:var(--mono);font-size:10.5px;color:var(--brand);letter-spacing:.1em;margin-bottom:9px;}
  .notes h2{font-family:var(--serif);font-size:25px;font-weight:600;margin:0 0 7px;letter-spacing:.01em;}
  .notes .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
  .tag{display:inline-flex;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;line-height:1.7;}
  .tag.brand{background:var(--brand-soft);color:var(--brand);}
  .tag.p1{background:#F0EDF8;color:#5B4B8A;}
  .tag.neutral{background:var(--sand);color:#8C948E;}
  .notes ul{list-style:none;padding:0;margin:0 0 20px;}
  .notes li{position:relative;padding:11px 0 11px 17px;font-size:12px;color:var(--ink-2);border-bottom:1px solid rgba(236,231,219,.9);line-height:1.65;}
  .notes li::before{content:"";position:absolute;left:0;top:17px;width:7px;height:1px;background:var(--brand);}
  .notes .sec{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8E9399;font-weight:600;margin:22px 0 6px;}
  .notes .kv{display:grid;grid-template-columns:72px 1fr;gap:5px 10px;font-size:11.5px;margin:0;}
  .notes .kv dt{color:#8E9399;}
  .notes .kv dd{margin:0;color:var(--ink-2);}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    .device.swap{opacity:1;transform:none;}
    .reveal{opacity:1;transform:none;}
  }
</style>

          + '<div class="d">云南省昆明市五华区 文林街 12 号 3 单元 502</div></div><button type="button" aria-label="编辑地址">编辑</button></div>'
          + '<div class="adrow"><div class="c"><div class="n">王先生 <span style="color:#8E9399;font-weight:400;font-size:11px;">138 **** 6621</span></div>'
          + '<div class="d">云南省昆明市盘龙区 北京路 88 号 山野工作室</div></div><button type="button" aria-label="编辑地址">编辑</button></div>'
          + '<div style="padding:12px 22px 4px;font-size:10px;color:#A2A6AB;">地址仅用于配送，不会用于其他用途。</div>'
          + '<div class="fabwrap"><button class="btn primary" type="button" style="width:100%;">+ 新增收货地址</button></div>';
      },
      chrome: {title:'收货地址'}
    }
  ];

  /* ================= render ================= */
  var host = document.getElementById('deviceHost');
  var notesEl = document.getElementById('notes');
  var navEl = document.getElementById('nav');

  function buildNav(){
    var groups = [];
    MP.forEach(function(s){ if(groups.indexOf(s.group) < 0) groups.push(s.group); });
    var h = '';
    groups.forEach(function(g){
      h += '<div class="grp">' + g + '</div>';
      MP.filter(function(s){ return s.group === g; }).forEach(function(s){
        h += '<button type="button" data-id="' + s.id + '"><span class="id">' + s.id + '</span><span>' + s.name + '</span></button>';
      });
    });
    navEl.innerHTML = h;
    navEl.addEventListener('click', function(e){
      var b = e.target.closest('button[data-id]');
      if(!b) return;
      select(b.getAttribute('data-id'));
    });
  }

  function buildDevice(s){
    var chrome = s.chrome || {};
    var body = s.body();
    var marks = ['<div class="checkoutbar', '<div class="bottombar', '<div class="fabwrap"'];
    var idx = -1;
    marks.forEach(function(mk){
      var i = body.lastIndexOf(mk);
      if(i > idx) idx = i;
    });
    var main = body, bar = '';
    if(idx > 0){ main = body.slice(0, idx); bar = body.slice(idx); }
    return '<div class="device" role="group" aria-label="' + s.name + ' 界面预览">'
      + statusbar()
      + navbar(chrome.title || s.name, {home: !chrome.title, act: chrome.act})
      + '<div class="screen' + (bar ? ' has-bar' : '') + (chrome.tab ? ' has-tab' : '') + '">' + main + '</div>'
      + (bar ? '<div class="barhost' + (chrome.tab ? ' above-tab' : '') + '">' + bar.replace('class="checkoutbar above-tab"','class="checkoutbar"') + '</div>' : '')
      + (chrome.tab ? tabbar(chrome.tab) : '')
      + '</div>';
  }

  function buildNotes(s){
    var tags = s.tags.map(function(t){
      if(t === 'P0') return '<span class="tag brand">P0</span>';
      if(t === 'P1') return '<span class="tag p1">P1</span>';
      return '<span class="tag neutral">' + t + '</span>';
    }).join('');
    var list = s.notes.map(function(n){ return '<li>' + n + '</li>'; }).join('');
    var states = s.states.map(function(x){ return '<span class="tag neutral" style="margin:0 6px 6px 0;">' + x + '</span>'; }).join('');
    return '<div class="nid">' + s.id + ' · ' + s.group + '</div>'
      + '<h2>' + s.name + '</h2><div class="meta">' + tags + '</div>'
      + '<div class="sec">设计要点</div><ul>' + list + '</ul>'
      + '<div class="sec">必须覆盖的状态</div><div>' + states + '</div>'
      + '<div class="sec">规格</div><dl class="kv"><dt>主导元素</dt><dd>' + s.keyEl + '</dd>'
      + '<dt>画布</dt><dd>375 × 812（含状态栏与安全区）</dd>'
      + '<dt>底色</dt><dd>浅灰 #F6F6F5 · 白块 + 极轻投影</dd>'
      + '<dt>线条</dt><dd>仅块内使用 1px 极浅分隔</dd></dl>';
  }

  function select(id, first){
    var s = MP.filter(function(x){ return x.id === id; })[0] || MP[0];
    var tmp = document.createElement('div');
    tmp.innerHTML = buildDevice(s);
    var node = tmp.firstChild;
    var old = host.firstChild;
    if(old && !first){
      node.classList.add('swap');
      host.appendChild(node);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ node.classList.remove('swap'); });
      });
      setTimeout(function(){ if(old && old.parentNode) old.parentNode.removeChild(old); }, 210);
    } else {
      host.innerHTML = '';
      host.appendChild(node);
    }
    notesEl.innerHTML = buildNotes(s);
    Array.prototype.forEach.call(navEl.querySelectorAll('button'), function(b){
      b.setAttribute('aria-current', b.getAttribute('data-id') === s.id ? 'true' : 'false');
    });
    document.title = '山野商城 · ' + s.name + '（' + s.id + '）· 小程序设计稿';
    if(!first && window.matchMedia && window.matchMedia('(max-width:900px)').matches){
      host.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }

  buildNav();
  select('MP-01', true);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>山野商城 · 管理后台设计稿 24 屏</title>
<style>
  :root{
    --canvas:#FFFFFF; --card:#FFFFFF; --card-2:#FAFAF9;
    --ink:#16181A; --ink-2:#55585C; --ink-3:#8E9399; --line:#EBEBE8; --line-2:#DEDEDA;
    --brand:#E2231A; --brand-2:#C21B14; --brand-soft:#FDEDEB;
    --price:#E2231A; --price-soft:#FDEDEB;
    --ok:#1F7A4C; --warn:#A9691A; --danger:#C22C1E;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
    --sans:"PingFang SC",-apple-system,BlinkMacSystemFont,"Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --mono:"SFMono-Regular",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#FFFFFF;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.6;}
  button{font-family:inherit;}

  .docbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:12px 24px;
    background:rgba(246,244,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid #EBEBE8;
  }
  .docbar .bm{display:flex;align-items:center;gap:9px;}
  .docbar .sq{width:24px;height:24px;border-radius:5px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;}
  .docbar .tt{font-family:var(--serif);font-size:14px;letter-spacing:.05em;}
  .docbar .sp{flex:1;}
  .docbar a{font-size:12px;color:var(--ink-3);text-decoration:none;padding:6px 10px;border-radius:6px;transition:background-color 160ms var(--ease),color 160ms var(--ease);}
  .docbar a:hover{background:var(--brand-soft);color:var(--brand);}
  .docbar a:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  .wrap{display:grid;grid-template-columns:212px minmax(0,1fr);align-items:start;}
  aside.rail{position:sticky;top:49px;height:calc(100vh - 49px);overflow-y:auto;padding:20px 14px 40px;border-right:1px solid #EBEBE8;background:#FFFFFF;}
  .rail h1{font-family:var(--serif);font-size:17px;font-weight:600;margin:0 0 2px;}
  .rail .cnt{font-size:11px;color:var(--ink-3);margin-bottom:14px;}
  .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 5px;padding-left:8px;font-weight:600;}
  .rail nav button{
    display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:7px 8px;border-radius:6px;font-size:12.5px;color:var(--ink-3);line-height:1.4;border-left:2px solid transparent;
    transition:background-color 160ms var(--ease),color 160ms var(--ease);
  }
  .rail nav button .id{font-family:var(--mono);font-size:10px;opacity:.6;}
  .rail nav button:hover{background:var(--brand-soft);color:var(--brand);}
  .rail nav button[aria-current="true"]{background:var(--brand-soft);color:var(--brand);border-left-color:var(--brand);font-weight:600;}
  .rail nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  main{padding:26px 30px 90px;min-width:0;}
  .stage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:26px;align-items:start;}
  @media(max-width:1280px){.stage{grid-template-columns:minmax(0,1fr) 220px;gap:18px;}}
  @media(max-width:1080px){
    .wrap{grid-template-columns:1fr;}
    aside.rail{position:static;height:auto;border-right:0;border-bottom:1px solid #EBEBE8;}
    .rail nav{display:flex;flex-wrap:wrap;gap:4px;}
    .rail nav button{width:auto;}
    .grp{width:100%;}
    .stage{grid-template-columns:1fr;}
    main{padding:18px 12px 60px;}
  }

  /* ================= app frame ================= */
  .frame{
    border:1px solid #E4E2DC;border-radius:14px;background:#FFFFFF;overflow:hidden;
    box-shadow:0 18px 44px -30px rgba(23,33,29,.22);
    display:flex;flex-direction:column;height:772px;
    transition:opacity 180ms var(--ease),transform 180ms var(--ease);
  }
  .frame.swap{opacity:0;transform:translateY(6px);}
  .frame-body{display:flex;flex:1;min-height:0;}

  .side{width:196px;flex:0 0 196px;background:#FFFFFF;border-right:1px solid var(--line);display:flex;flex-direction:column;}
  .side .logo{display:flex;align-items:center;gap:9px;padding:16px 16px 14px;}
  .side .logo .sq{width:24px;height:24px;border-radius:5px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:13px;}
  .side .logo .n{font-family:var(--serif);font-size:13.5px;letter-spacing:.08em;}
  .side .logo .b{font-size:10px;color:var(--ink-3);}
  .side nav{padding:4px 8px 16px;overflow-y:auto;scrollbar-width:none;}
  .side nav::-webkit-scrollbar{display:none;}
  .side .navgrp{font-size:10px;letter-spacing:.1em;color:#A3ADA6;padding:10px 10px 4px;text-transform:uppercase;}
  .side .item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:12px;color:#5C665F;text-decoration:none;transition:background-color 160ms var(--ease),color 160ms var(--ease);}
  .side .item:hover{background:#F6F6F4;color:var(--ink);}
  .side .item:focus-visible{outline:2px solid var(--brand);outline-offset:-1px;}
  .side .item.on{background:var(--brand-soft);color:var(--brand);font-weight:600;}
  .side .item .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .side .item.on .dot{background:var(--brand);}
  .side .foot{margin-top:auto;padding:12px 14px;border-top:1px solid var(--line);font-size:10.5px;color:#A3ADA6;display:flex;align-items:center;gap:7px;}
  .side .foot .av{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}

  .work{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--canvas);}
  .topbar2{height:46px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;}
  .topbar2 .bc{font-size:11.5px;color:var(--ink-3);}
  .topbar2 .bc b{color:var(--ink);font-weight:600;}
  .topbar2 .sp{flex:1;}
  .topbar2 .search{display:flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--ink-3);font-size:11px;min-width:150px;}
  .topbar2 .search input{border:0;background:none;outline:0;font-size:11px;font-family:inherit;color:var(--ink);width:100%;}
  .topbar2 .ib{width:26px;height:26px;border:0;background:none;border-radius:6px;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;}
  .topbar2 .ib:hover{background:#F1EFE9;color:var(--ink);}
  .topbar2 .ib:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}
  .topbar2 .ib .bd{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--price);}

  .canvas{padding:20px 24px 40px;overflow-y:auto;flex:1;min-height:0;scrollbar-width:thin;}
  .canvas::-webkit-scrollbar{width:8px;}
  .canvas::-webkit-scrollbar-thumb{background:#DCD9D2;border-radius:4px;}

  .ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;}
  .ph h2{font-size:19px;font-weight:650;margin:0;letter-spacing:-.005em;line-height:1.3;}
  .ph .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;}

  .btn{height:30px;border-radius:6px;font-size:12px;font-weight:600;padding:0 12px;cursor:pointer;border:1px solid transparent;
    display:inline-flex;align-items:center;gap:5px;transition:background-color 160ms var(--ease),border-color 160ms var(--ease),color 160ms var(--ease);}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-2);}
  .btn.ghost{background:#fff;border-color:var(--line-2);color:var(--ink-2);}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand);}
  .btn.text{background:none;color:var(--brand);padding:0 6px;height:26px;}
  .btn.text:hover{background:var(--brand-soft);}
  .btn.danger{background:none;border-color:#E2C7C0;color:var(--danger);}
  .btn.danger:hover{background:#FBEFEC;}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px;}
  .btn[disabled]{background:#EFEFED;color:#9AA49D;border-color:transparent;cursor:not-allowed;}
  .btn.sm{height:26px;font-size:11.5px;padding:0 9px;}

  .tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:3px;line-height:1.7;white-space:nowrap;}
  .tag.ok{background:#EAF5EE;color:var(--ok);}
  .tag.warn{background:#FBF3E2;color:var(--warn);}
  .tag.danger{background:#FBEFEC;color:var(--danger);}
  .tag.neutral{background:#F1EFE9;color:var(--ink-3);}
  .tag.brand{background:var(--brand-soft);color:var(--brand);}
  .tag.dot::before{content:"";width:4px;height:4px;border-radius:50%;margin-right:4px;background:currentColor;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;}
  .panel .ph2{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);}
  .panel .ph2 .t{font-size:12px;font-weight:650;}
  .panel .ph2 .s{font-size:11px;color:var(--ink-3);}
  .panel .ph2 .acts{margin-left:auto;display:flex;gap:6px;}
  .panel .pb{padding:14px 16px;}

  .kpis{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;}
  .kpi{flex:1;padding:14px 16px;border-right:1px solid var(--line);}
  .kpi:last-child{border-right:0;}
  .kpi .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;}
  .kpi .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.2;}
  .kpi .v i{font-size:12px;font-style:normal;color:var(--ink-3);margin-right:2px;}
  .kpi .d{font-size:10.5px;color:var(--ink-3);margin-top:5px;}
  .kpi .d b{color:var(--ok);font-weight:600;}
  .kpi.act .v{color:var(--price);}

  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
    padding:9px 12px;background:var(--card-2);border-bottom:1px solid var(--line);white-space:nowrap;}
  .tbl th.r,.tbl td.r{text-align:right;font-variant-numeric:tabular-nums;}
  .tbl td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:0;}
  .tbl tbody tr:hover{background:#FCFCFA;}
  .tbl td .nm{color:var(--ink);font-weight:600;}
  .tbl td .sub{color:var(--ink-3);font-size:10.5px;margin-top:1px;}
  .tbl .thumb{width:30px;height:30px;border-radius:4px;object-fit:cover;background:#E8E4DA;vertical-align:middle;}
  .tbl .ops{display:flex;gap:2px;}

  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card);}
  .toolbar .inp{height:28px;border:1px solid var(--line-2);border-radius:5px;background:#fff;font-size:11.5px;padding:0 9px;font-family:inherit;color:var(--ink);min-width:140px;}
  .toolbar .inp:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .toolbar select.inp{min-width:110px;}
  .toolbar .sp{flex:1;}
  .seg2{display:flex;gap:2px;background:#F4F4F2;padding:2px;border-radius:6px;}
  .seg2 button{border:0;background:none;font-size:11.5px;color:var(--ink-3);padding:4px 10px;border-radius:4px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .seg2 button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(23,33,29,.06);}
  .seg2 button:focus-visible{outline:2px solid var(--brand);outline-offset:1px;}

  .pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);}
  .pager button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:4px;font-size:11px;color:var(--ink-3);cursor:pointer;}
  .pager button.on{background:var(--brand);border-color:var(--brand);color:#fff;}

  .cols2{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start;}
  .cols3{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;}
  @media(max-width:1100px){.cols2,.cols3{grid-template-columns:1fr;}}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:11px;font-weight:600;color:var(--ink-2);}
  .field .inp,.field select,.field textarea{height:30px;border:1px solid var(--line-2);border-radius:5px;background:#fff;font-size:12px;padding:0 9px;font-family:inherit;color:var(--ink);width:100%;}
  .field textarea{height:66px;padding:7px 9px;resize:none;line-height:1.6;}
  .field .inp::placeholder,.field textarea::placeholder{color:#A3ADA6;}
  .field .inp:focus-visible,.field select:focus-visible,.field textarea:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .field .hint{font-size:10.5px;color:var(--ink-3);}
  .field .err{font-size:10.5px;color:var(--danger);}
  .grid2f{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .grid3f{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px;}

  .chart{position:relative;padding:4px 6px 0;}
  .chart svg{display:block;width:100%;height:150px;}
  .chart .axis{display:flex;justify-content:space-between;padding:6px 2px 0;font-size:10px;color:#A3ADA6;font-variant-numeric:tabular-nums;}
  .legend{display:flex;gap:14px;padding:0 16px 12px;font-size:10.5px;color:var(--ink-3);}
  .legend i{width:10px;height:2px;display:inline-block;margin-right:5px;vertical-align:middle;}

  .todo{padding:0;}
  .todo .row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-2);}
  .todo .row:last-child{border-bottom:0;}
  .todo .row .c{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);}
  .todo .row .c.alarm{color:var(--price);}

  .sku-row{display:grid;grid-template-columns:1fr 1fr 90px 90px 70px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:11.5px;}
  .sku-row input{height:26px;border:1px solid var(--line);border-radius:4px;font-size:11.5px;padding:0 7px;font-family:inherit;width:100%;text-align:right;font-variant-numeric:tabular-nums;}
  .sku-row input:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft);}
  .sku-head{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:6px;}

  .tree{font-size:12px;}
  .tree .node{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);}
  .tree .node .nm{font-weight:600;color:var(--ink);}
  .tree .node .c{font-size:10.5px;color:var(--ink-3);}
  .tree .node .ops{margin-left:auto;display:flex;gap:2px;}
  .tree .node.child{padding-left:32px;}
  .tree .node.child .nm{font-weight:500;color:var(--ink-2);}

  .coupon{display:flex;align-items:stretch;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px;}
  .coupon .amt{width:112px;flex:0 0 112px;background:var(--brand-soft);color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;position:relative;}
  .coupon .amt b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}
  .coupon .amt b .c{font-size:12px;}
  .coupon .amt span{font-size:10.5px;margin-top:3px;opacity:.8;}
  .coupon .info{flex:1;padding:12px 14px;min-width:0;}
  .coupon .info .t{font-size:12.5px;font-weight:650;margin-bottom:3px;}
  .coupon .info .d{font-size:10.5px;color:var(--ink-3);line-height:1.6;}
  .coupon .info .bar{height:3px;background:#EFEFED;border-radius:2px;margin-top:9px;overflow:hidden;}
  .coupon .info .bar i{display:block;height:100%;background:var(--brand);}
  .coupon .st{align-self:center;padding:0 14px;}

  .modalwrap{position:absolute;inset:0;background:rgba(20,28,24,.42);display:flex;align-items:center;justify-content:center;z-index:5;}
  .modal{width:430px;background:#fff;border-radius:10px;box-shadow:0 24px 60px -12px rgba(20,30,26,.28);overflow:hidden;}
  .modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);}
  .modal .mh .t{font-size:13px;font-weight:650;}
  .modal .mh button{margin-left:auto;background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px;border-radius:4px;}
  .modal .mb{padding:16px 18px;}
  .modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--card-2);}

  .logrow{display:grid;grid-template-columns:110px 90px 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11.5px;}
  .logrow .t{color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .logrow .who{color:var(--ink);font-weight:600;}
  .logrow .what{color:var(--ink-2);}

  .imggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .imggrid figure{margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;}
  .imggrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#E8E4DA;}
  .imggrid figcaption{font-size:10px;color:var(--ink-3);padding:5px 7px;display:flex;justify-content:space-between;}

  /* ---------- login ---------- */
  .login-frame{
    height:772px;border:1px solid #D9D5CB;border-radius:14px;overflow:hidden;position:relative;
    background:linear-gradient(160deg,#B7170F 0%,#E2231A 52%,#C21B14 100%);
    box-shadow:0 22px 54px -28px rgba(23,33,29,.3);
    display:flex;align-items:center;padding:0 72px;
  }
  .login-frame .grain{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.35) .6px,transparent .6px);background-size:3px 3px;}
  .login-frame .brandcol{position:absolute;left:72px;top:60px;color:#fff;}
  .login-frame .brandcol .wm{font-family:var(--serif);font-size:13px;letter-spacing:.28em;opacity:.9;}
  .login-frame .brandcol .big{font-family:var(--serif);font-size:40px;line-height:1.2;margin-top:26px;max-width:420px;text-wrap:balance;}
  .login-frame .brandcol .sm{font-size:11.5px;opacity:.62;margin-top:14px;max-width:320px;line-height:1.8;}
  .login-card{position:relative;margin-left:auto;width:330px;color:#fff;}
  .login-card h3{font-size:16px;font-weight:600;margin:0 0 4px;}
  .login-card p{font-size:11.5px;opacity:.66;margin:0 0 26px;}
  .lf{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .lf label{font-size:11px;opacity:.8;}
  .lf input{height:38px;border-radius:7px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;padding:0 11px;font-size:12.5px;font-family:inherit;outline:none;transition:border-color 160ms var(--ease),background-color 160ms var(--ease);}
  .lf input::placeholder{color:rgba(255,255,255,.42);}
  .lf input:focus-visible{border-color:rgba(255,255,255,.72);background:rgba(255,255,255,.12);box-shadow:0 0 0 3px rgba(255,255,255,.12);}
  .lf .err{font-size:10.5px;color:#F2B8AA;display:flex;align-items:center;gap:5px;}
  .loginbtn{width:100%;height:40px;border-radius:7px;border:0;background:#fff;color:#B7170F;font-size:13px;font-weight:650;cursor:pointer;margin-top:8px;transition:background-color 160ms var(--ease);}
  .loginbtn:hover{background:#EDF3EE;}
  .loginbtn:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  .login-card .foot{font-size:10.5px;opacity:.48;margin-top:22px;line-height:1.7;}

  /* ---------- notes ---------- */
  .notes{padding-top:2px;}
  .notes .nid{font-family:var(--mono);font-size:11px;color:var(--brand);letter-spacing:.08em;margin-bottom:8px;}
  .notes h2{font-family:var(--serif);font-size:22px;font-weight:600;margin:0 0 6px;}
  .notes .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}

  /* 09 发货弹窗：基于订单详情 + 弹层 */
  (function(){
    var idx = AD.map(function(s){ return s.id; }).indexOf('AD-09');
    AD[idx].body = function(){
      var detail = AD.filter(function(s){ return s.id === 'AD-08'; })[0].body();
      return '<div style="position:relative;min-height:100%;">'
        + '<div style="filter:blur(.6px);opacity:.66;pointer-events:none;" aria-hidden="true">' + detail + '</div>'
        + '<div class="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="shipTitle">'
        + '<div class="mh"><span class="t" id="shipTitle">发货 · 1 件商品</span><button type="button" aria-label="关闭发货弹窗">' + ic('close') + '</button></div>'
        + '<div class="mb">'
        + '<div class="field"><label for="exp">物流公司</label><select id="exp" name="express"><option>顺丰速运</option><option>中通快递</option><option>圆通速递</option><option>京东物流</option></select></div>'
        + '<div class="field"><label for="expNo">运单号</label><input class="inp" id="expNo" name="trackingNo" type="text" value="SF123456789012" autocomplete="off" spellcheck="false"><span class="hint">扫码枪可直接输入，支持大小写字母与数字</span></div>'
        + '<div class="field" style="margin-bottom:0;"><label for="expNote">发货备注（选填）</label><input class="inp" id="expNote" name="shipNote" type="text" placeholder="例：已加防震填充…" autocomplete="off"></div>'
        + '<div style="margin-top:14px;padding:10px 12px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--ink-2);line-height:1.7;">本次发货：勐海古树普洱 2019 · 357g 单饼 × 1<br>发货后订单转为「待收货」，买家将收到订阅消息。</div>'
        + '</div>'
        + '<div class="mf"><button class="btn ghost" type="button">取消</button><button class="btn primary" type="button">确认发货</button></div>'
        + '</div></div></div>';
    };
  })();

  /* ================= render ================= */
  var host = document.getElementById('host');
  var notesEl = document.getElementById('notes');
  var navEl = document.getElementById('nav');

  function buildNav(){
    var groups = [];
    AD.forEach(function(s){ if(groups.indexOf(s.group) < 0) groups.push(s.group); });
    var h = '';
    groups.forEach(function(g){
      h += '<div class="grp">' + g + '</div>';
      AD.filter(function(s){ return s.group === g; }).forEach(function(s){
        h += '<button type="button" data-id="' + s.id + '"><span class="id">' + s.id + '</span><span>' + s.name + '</span></button>';
      });
    });
    navEl.innerHTML = h;
    navEl.addEventListener('click', function(e){
      var b = e.target.closest('button[data-id]');
      if(!b) return;
      select(b.getAttribute('data-id'));
    });
  }

  function buildNotes(s){
    var tags = s.tags.map(function(t){
      if(t === 'P0') return '<span class="tag brand">P0</span>';
      if(t === 'P1') return '<span class="tag brand" style="background:#F0EEF8;color:#5B4B8A;">P1</span>';
      return '<span class="tag neutral">' + t + '</span>';
    }).join('');
    var list = s.notes.map(function(n){ return '<li>' + n + '</li>'; }).join('');
    var states = s.states.map(function(x){ return '<span class="tag neutral">' + x + '</span>'; }).join('');
    return '<div class="nid">' + s.id + ' · ' + s.group + '</div>'
      + '<h2>' + s.name + '</h2>'
      + '<div class="meta">' + tags + '</div>'
      + '<div class="sec">设计要点</div><ul>' + list + '</ul>'
      + '<div class="sec">必须覆盖的状态</div><div class="states">' + states + '</div>'
      + '<div class="sec">规格</div><dl class="kv"><dt>主导元素</dt><dd>' + s.keyEl + '</dd>'
      + '<dt>画布</dt><dd>' + (s.bare ? '1280 × 772 登录页' : '1280 × 772（侧栏 196）') + '</dd>'
      + '<dt>密度</dt><dd>表格 12.5px · 行高 44 · 数字右对齐</dd>'
      + '<dt>强调色</dt><dd>正红仅用于主按钮与激活项</dd></dl>';
  }

  function select(id, first){
    var s = AD.filter(function(x){ return x.id === id; })[0] || AD[0];
    var markup = s.bare ? s.body() : shell(s.nav, s.body());
    var tmp = document.createElement('div');
    tmp.innerHTML = markup;
    var node = tmp.firstChild;
    var old = host.firstChild;
    if(old && !first){
      node.classList.add('swap');
      host.appendChild(node);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ node.classList.remove('swap'); }); });
      setTimeout(function(){ if(old && old.parentNode) old.parentNode.removeChild(old); }, 200);
    } else {
      host.innerHTML = '';
      host.appendChild(node);
    }
    notesEl.innerHTML = buildNotes(s);
    Array.prototype.forEach.call(navEl.querySelectorAll('button'), function(b){
      b.setAttribute('aria-current', b.getAttribute('data-id') === s.id ? 'true' : 'false');
    });
    document.title = '山野商城 · ' + s.name + '（' + s.id + '）· 后台设计稿';
  }

  buildNav();
  select('AD-02', true);
})();
</script>
</body>
</html>
